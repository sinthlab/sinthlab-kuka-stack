/**:
  ros__parameters:
    # ---- RESISTANCE of the pull: the felt stiffness, chosen per trial (dashboard slider) ----
    # The cabinet's stiffness is fixed by the SmartPad profile and ROS cannot change it. ROS SOFTENS it:
    # while the animal pulls, the arm's equilibrium follows part of the pull, so the spring stretches
    # less -- felt stiffness = base x (1 - fraction followed). It can only SOFTEN, never stiffen, and at
    # least 50 N/m of spring always remains. See actions/resistance_softener.py.
    #
    # >>> SmartPad: "Uniform 100" (100 N/m, rotation 300) -- the usual feel, and the default here. Enter
    #     the profile's translational stiffness below as the base: the slider then runs from 50 N/m up to
    #     the base, in steps of 10. For a stiffer range pick "Uniform 400" and enter 400 (50-400 N/m).
    #     The further below the base you go, the more a quick pull feels like the base (see below):
    #     choose a base near the stiffest you will actually use.
    #     base_stiffness_n_per_m MUST equal the profile's translational stiffness: if it says 400 while
    #     the SmartPad runs Uniform 100, every pull feels 4x softer than the slider says.
    #     Equal values (stiffness = base) switch the softening off: the arm feels the bare profile.
    # Quick pulls feel somewhat stiffer than the setting (the equilibrium follows from ROS at 100 Hz,
    # slightly behind the arm), and at a fixed damping ratio a stiffer base is more damped -- pick a
    # lower damping ratio on the SmartPad if pulls feel viscous.
    resistance:  # felt stiffness of the pull
      base_stiffness_n_per_m: 100.0  # the SmartPad profile's translational stiffness [N/m] (per-run; must match the SmartPad)
      stiffness_n_per_m: 100.0  # felt stiffness of the pull [N/m] (live, from the next trial): 50 up to the base

    # Apple-pluck drives a joint position controller (LBRJointPositionCommandController) via the
    # MoveToPositionJointSpace action; the cabinet (LbrImpedanceControlServer) provides compliance.
    # ==== PARADIGM -- fixed for the run ====
    #   pluck         the pull from a fixed start: go cue -> pull -> threshold -> hold -> park.
    #   perturb       the same, but after the go cue the apple is displaced by a polar (r, theta) offset
    #                 (perturb_start, below), and the pull is measured from where it settles.
    #   perturb_bump  the same perturbation, but triggered when the hand GRASPS the apple (grasp, below),
    #                 so it is felt as a bump; the pull is measured from the perturbed spring position.
    #   random_start  the pull as in pluck, but each trial starts at one of 9 positions -- the origin
    #                 and the 8 compass directions around it (random_start, below).
    # Dashboard: Apple Pluck -> "Pluck normal" / "Pluck perturb" / "Pluck perturb bump" / "Pluck random start".
    # Launch: paradigm:=perturb (or perturb_bump, random_start) overrides it.
    # Every trial is recorded as experiment "apple_pluck", with this paradigm in its sidecar.
    paradigm: "pluck"  # pluck | perturb | perturb_bump | random_start

    apple_pluck_impedance_control_displacement:  # pull monitor: baseline -> threshold (snap) -> hold -> park
      update_rate: 200  # loop rate of this action [Hz]
      base_frame: lbr_link_0  # TF frame positions are measured in
      ee_frame: lbr_link_ee  # TF frame of the end effector being tracked
      # How far the apple must be pulled from its start to count as a pluck. `norm` is the straight-line
      # distance in any direction: the apple points at the monkey and is pulled toward it, so no single
      # base axis carries the pull. (x | y | z would measure just that base-frame axis.)
      cartesian_axis: norm  # how the pull is measured: norm = 3-D distance; x | y | z = that base axis only
      cartesian_displacement_threshold_m: 0.1  # pull from the baseline that counts as success (snap) [m]
      force_release_shutdown_delay_sec: 0.8  # after the snap, hold the arm frozen this long, then park [s]
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]
    move_to_start:  # joint-space move to the trial start pose
      update_rate: 200  # loop rate of this action [Hz]
      # START POSE -- the apple points AT the monkey (+X), tilted 13 deg UP, at about the park height.
      # By the iiwa7 URDF (lbr_link_0 -> lbr_link_ee): flange (0.33, 0, 1.03) m, apple centre
      # ~(0.53, 0, 1.08) m (park holds it at ~1.09 m), symmetric in-plane posture.
      #   This is C, the origin of the random_start grid (random_start.positions.C, below).
      #   6D condition number 15.2 (smallest singular value 0.125); every joint >= 59 deg from its limit.
      #   The arm is close to full stretch here, so the room to move is limited: a pull toward the monkey
      #   gets ~0.16 m before nearing a limit or singularity (the threshold is 0.10 m), and a 10 cm
      #   perturbation in some directions takes the arm to a smallest singular value of ~0.07 (sluggish,
      #   not singular). Check with diagnostics/solve_start_grid.py and check_park.py after any change.
      # KNOBS (re-solve random_start after changing the start; keep A4 negative, like the park pose):
      #   A6 (6th value)  tilt: the apple pivots about the wrist.
      #   A7 (7th value)  turns the effector about its own axis without moving the apple, e.g. to put the
      #                   ring's dead quarter out of the monkey's view.
      #   height          [0, -6.3, 0, -44.4, 0, 38.9, 0]  -> apple 5 cm higher (random_start N)
      #                   [0, -17.9, 0, -72.5, 0, 22.5, 0] -> apple 5 cm lower (random_start S)
      target_joint_position:  # start pose, joint angles A1..A7 [deg]
      - 0.0
      - -13.0
      - 0.0
      - -60.0
      - 0.0
      - 30.0
      - 0.0
      joint_move_tolerance: 0.01  # done when every joint is within this of its target [rad]
      move_to_pos_v_max:  # peak joint speed [deg/s] (converted to rad/s in code)
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      speed_scale: 0.7  # LIVE, applies at once, from the next move: time-stretches this move -- 0.5 = twice as slow, 2 = twice as fast (0.25-2)
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]
      # The arm comes from park (~40 cm) on a soft spring, so it lags the command: wait until it is
      # really there, so the quiet window (and the grasp detector's resting-force tare) starts at rest.
      wait_for_physical_arrival: true  # also wait for the MEASURED arm to arrive, not just the command
      cartesian_move_tolerance: 0.03  # apple within this of the start counts as arrived [m] (the soft spring sags ~cm)
      physical_arrival_timeout_sec: 1.5  # stop waiting for the measured arm after this long, with a warning [s] (the soft spring can sag past the tolerance)
    # PARK -- where the arm waits between trials, out of the monkey's reach: the apple pulled back over
    # the robot's base and raised, at ~(0.2, 0, 1.1) m in every experiment. The run's FIRST move goes here
    # from wherever the arm is (the SmartPad app's ready pose, or where a previous run left it); then
    # every trial is park -> start -> trial -> park. Pausing holds here.
    # This is the elbow-NEGATIVE posture (A4 < 0), like this experiment's start. The maze family parks at
    # the same place with the elbow the other way. Start and park must bend the elbow the same way, or
    # every park <-> start move passes a straight, singular elbow (refused by the dashboard and at start-up).
    move_to_park:  # joint-space move to the park pose: before the first trial and after every trial
      update_rate: 200  # loop rate of this action [Hz]
      target_joint_position: [0.0, -55.0, 0.0, -95.0, 0.0, 10.0, 0.0]  # park pose A1..A7 [deg] (per-run)
      joint_move_tolerance: 0.15  # done when every joint is within this of its target [rad]
      move_to_pos_v_max:  # peak joint speed [deg/s]
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      speed_scale: 1.0  # LIVE, applies at once, from the next move: time-stretches this move -- 0.5 = twice as slow, 2 = twice as fast (0.25-2)
      first_move_speed_scale: 1.0  # speed scale of the run's FIRST move here (per-run); this family never crosses the straight elbow, so no need to crawl
      hold_sec: 2.0  # LIVE: how long the arm waits at park before moving to the next trial's start [s]
      wait_for_physical_arrival: true  # also wait for the MEASURED arm to arrive, not just the command
      cartesian_move_tolerance: 0.03  # apple within this of the park pose counts as arrived [m]
      physical_arrival_timeout_sec: 10.0  # stop waiting for the measured arm after this long, with a warning [s]
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]
    # ==== PERTURB PARADIGMS ONLY: the displacement of the apple (live) ====
    # Used when paradigm is "perturb" (after the go cue) or "perturb_bump" (after the grasp); shown on
    # the dashboard only under those tabs. To run unperturbed trials inside a perturb run, set polar_r_m
    # to 0 (live).
    perturb_start:  # the perturbation: polar offset from the start, jerk-limited joint move
      update_rate: 200  # loop rate of this action [Hz]
      # WHERE -- a POLAR offset (r, theta) from the start EE position, re-solved every trial by position
      # IK seeded at the start posture.
      #   polar_r_m        how far [m]. The apple points at the monkey, so keep it small.
      #   polar_plane      the plane theta turns in:
      #                      frontal    Y-Z, the plane FACING the monkey (theta from +Y toward +Z). The
      #                                 apple never moves toward or away from the monkey.
      #                      horizontal X-Y (theta from +X toward +Y); theta 0 = toward the monkey.
      #                      sagittal   X-Z (theta from +X toward +Z); theta 0 = toward the monkey.
      #   polar_theta_deg  direction in that plane. frontal: 0 = +Y (sideways), 90 = up, 180 = -Y
      #                    (the other side), 270 = down.
      #   polar_r_m is CAPPED PER PLANE: frontal 0.15, horizontal 0.175, sagittal 0.10 m. Checked by IK
      #   from this start pose, every direction in 15 deg steps: all solve exactly and stay >= 36 deg from
      #   every joint limit; near full stretch the smallest singular value drops to ~0.06-0.09 at the
      #   caps (~0.07 at r = 0.10), so a large perturbation is less crisp than from a lower start.
      #   Position-only IK lets the flange tilt: up to ~22 / 19 / 14 deg at the caps. The caps live in
      #   sinthlab_bringup/helpers/live_params.py (PERTURB_R_MAX); the dashboard and the orchestrator
      #   both enforce them, and the action warns if a solution still lands within 5 deg of a limit.
      polar_r_m: 0.10  # perturbation distance from the start [m] (~10 N on a held apple at Uniform 100)
      polar_theta_deg: 0.0  # perturbation direction within polar_plane [deg] (frontal: 0 = +Y, 90 = up)
      polar_plane: frontal  # plane theta turns in: frontal (Y-Z) | horizontal (X-Y) | sagittal (X-Z)
      joint_move_tolerance: 0.01  # done when every joint is within this of its target [rad]
      # HOW FAST -- a jerk-limited joint trajectory (ruckig) moving the impedance ANCHOR. Set it with
      # speed_scale (live slider, applies from the next move): it scales v/a/j by s, s^2, s^3, so the move takes
      # exactly 1/s as long. At r = 0.05 m from the start pose, with the limits below:
      #   speed_scale 0.5 -> 1.46 s, peak 0.07 m/s
      #   speed_scale 1   -> 0.73 s, peak 0.13 m/s   (default)
      #   speed_scale 2   -> 0.37 s, peak 0.26 m/s
      # The limits themselves (per-run) are the base the scale multiplies. On a move this short the
      # joints travel a few degrees, so v_max never binds and a_max / j_max act only through square /
      # cube roots -- which is why changing them alone hardly changes the move.
      # The physical apple follows the anchor through the impedance spring, so it lags a very fast move.
      move_to_pos_v_max:  # peak joint speed [deg/s], per joint
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      speed_scale: 1.0  # LIVE, applies at once, from the next move: time-stretches this move -- 0.5 = twice as slow, 2 = twice as fast (0.25-2)
      # WHEN (perturb only) -- the delay after the go cue before the perturbation. Fixed, or drawn per
      # trial so the animal cannot predict it; the delay each trial used is recorded (event
      # perturb_delay_start, its arg). perturb_bump has its own, counted from the grasp: grasp.delay_*.
      start_delay_mode: "fixed"  # fixed = start_delay_sec every trial; random = uniform in [min, max] each trial
      start_delay_sec: 1.5  # the delay in fixed mode [s]
      start_delay_min_sec: 0.2  # the shortest delay in random mode [s]
      start_delay_max_sec: 0.6  # the longest delay in random mode [s]
      # perturb only: the arm must settle where the perturbation left it before the pull baseline
      # locks (the monitor starts as soon as the move completes, while the physical arm still lags
      # it). perturb_bump does not wait: its baseline is the perturbed spring position, at once.
      baseline_settle_sec: 1.0  # perturb only: wait after the perturbation before locking the pull baseline [s]
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]
      wait_for_physical_arrival: false  # also wait for the MEASURED arm to arrive, not just the command
      cartesian_move_tolerance: 0.03  # EE within this of the target counts as physically arrived [m] (only when waiting)
      physical_arrival_timeout_sec: 0.0  # stop waiting for the measured arm after this long [s]; 0 = no limit

    # ==== PERTURB_BUMP PARADIGM ONLY: detecting the grasp that triggers the perturbation (live) ====
    # Used only when paradigm is "perturb_bump"; shown on the dashboard only under Pluck perturb bump.
    # No force sensor: the hand force comes from the arm's joint torque sensors (as in Free Move), so a
    # grasp is FORCE on the apple -- a hand resting on it without pushing or pulling is not detected.
    # The resting force is measured during the quiet window (apple untouched) and subtracted; a grasp
    # is the remaining force at or above threshold_n for hold_sec. No grasp within timeout_sec -> the
    # trial ends (event grasp_timeout), the arm resets, and the next trial starts.
    # Pick threshold_n with debug_log_enabled on: it prints the force while waiting, so you can see the
    # resting noise and a real grasp. Too low triggers on noise; too high misses light grasps.
    grasp:  # grasp detection (perturb_bump)
      threshold_n: 2.5  # force on the apple that counts as a grasp, after the resting force is subtracted [N]
      hold_sec: 0.03  # the force must stay above threshold_n this long -- rejects single-sample spikes [s]
      timeout_sec: 10.0  # no grasp within this long after the go cue -> end the trial and reset [s]
      # HOW FAST the bump moves -- used instead of perturb_start.speed_scale in this paradigm. A bump must
      # be sudden: at perturb's gentle default (1) the spring position barely moves for ~0.2 s and a held
      # apple feels a slow lean. At r = 0.10 m: 1 -> 5 mm at 185 ms, done 0.92 s; 3 -> 5 mm at 65 ms,
      # done 0.31 s. Capped at 3 = the fastest acceleration / jerk validated for the perturbation.
      bump_speed_scale: 3.0  # LIVE, applies at once, from the next bump: speed of the bump move (0.25-3)
      # The delay from the detected grasp to the perturbation. Default 0: the bump follows the grasp at
      # once (the detection itself lags first contact by ~hold_sec plus the force rising to threshold).
      # Random draws it per trial so the animal cannot predict it; each trial's delay is recorded
      # (event perturb_delay_start, its arg).
      delay_mode: "fixed"  # fixed = delay_sec every trial; random = uniform in [delay_min_sec, delay_max_sec] each trial
      delay_sec: 0.0  # the delay after the grasp in fixed mode [s]; 0 = at once
      delay_min_sec: 0.0  # the shortest delay after the grasp in random mode [s]
      delay_max_sec: 0.3  # the longest delay after the grasp in random mode [s]
      tare_sec: 0.5  # the resting force is averaged over this last stretch of the quiet window, before the go cue [s]; <= quiet_window_sec
      tare_max_n: 10.0  # a resting force above this means the apple was held during the quiet window: keep the previous tare [N]
      # The arm is still and well conditioned while waiting, so this can be far below Free Move's 0.1
      # (which reads ~20% low at these poses): 0.02 reads 99% of the true force at every apple start.
      jacobian_damping: 0.02  # damping of the Jacobian inverse in the force estimate: larger = steadier near singularities, but reads force weaker
      ee_frame: lbr_link_ee  # the link the force is estimated at (the flange the apple is mounted on)
      debug_log_enabled: false  # print the measured force periodically while waiting for the grasp
      debug_log_rate_hz: 5.0  # how often that debug line prints [Hz]

    # ==== RANDOM_START PARADIGM ONLY: a different start position every trial (per-run) ====
    # Used only when paradigm is "random_start"; shown on the dashboard only under Pluck random start.
    # Each trial starts at one of these 9 positions -- the origin C and the 8 compass directions around
    # it -- in a random order that visits all 9 once before any repeats (shuffled blocks of 9). The
    # trial's sidecar records which one (`start_position`). Recover returns to that trial's position.
    #
    # The grid lies in the plane FACING the monkey (base Y-Z), compass as the monkey sees it (it faces
    # the apple from +X):     NW  N  NE      N = up (+Z)      E = the monkey's right (+Y)
    #                          W  C  E       S = down (-Z)    W = the monkey's left (-Y)
    #                         SW  S  SE
    # C is the normal start pose (move_to_start, as in the pluck and perturb paradigms); every other
    # position is 5 cm from C (the diagonals too: a circle, not a square). Every position keeps the
    # apple's orientation -- it points at the monkey with the same tilt, only translated. Solved by 6-D
    # IK from C (diagnostics/solve_start_grid.py): every joint >= 46 deg from its limit (S is the
    # tightest), >= 56 deg after a further 10 cm pull toward the monkey, smallest Jacobian singular
    # value >= 0.118.
    # To change the spacing, or after changing move_to_start, re-solve and paste the output here:
    #   ros2 run sinthlab_bringup solve_start_grid.py --spacing 0.05
    random_start:  # the 9 start positions of the random_start paradigm
      positions:  # each A1..A7 [deg]; C must equal move_to_start.target_joint_position
        C: [0.0, -13.0, 0.0, -60.0, 0.0, 30.0, 0.0]  # origin: the normal start pose
        N: [0.0, -6.3, 0.0, -44.4, 0.0, 38.9, 0.0]  # 5 cm above C
        NE: [-2.0, -8.3, 8.1, -49.1, -10.2, 36.5, 8.0]  # 5 cm from C, up and to the monkey's right
        E: [-6.6, -12.7, 12.2, -59.5, -11.4, 30.7, 11.3]  # 5 cm to the monkey's right of C (+Y)
        SE: [-6.5, -16.6, 9.0, -68.8, -6.2, 24.8, 7.6]  # 5 cm from C, down and to the monkey's right
        S: [0.0, -17.9, 0.0, -72.5, 0.0, 22.5, 0.0]  # 5 cm below C
        SW: [6.5, -16.6, -9.0, -68.8, 6.2, 24.8, -7.6]  # 5 cm from C, down and to the monkey's left
        W: [6.6, -12.7, -12.2, -59.5, 11.4, 30.7, -11.3]  # 5 cm to the monkey's left of C (-Y)
        NW: [2.0, -8.3, -8.1, -49.1, 10.2, 36.5, -8.0]  # 5 cm from C, up and to the monkey's left

    audio_cue_play:  # trial-start (go) tone
      frequency_hz: 1500  # trial-start (go) tone: pitch [Hz]
      duration_ms: 1500  # trial-start (go) tone: length [ms]
    audio_cue_snap:  # threshold-reached tone
      frequency_hz: 2000  # threshold-reached tone: pitch [Hz]
      duration_ms: 500  # threshold-reached tone: length [ms]

    # ---- LIVE parameters: the dashboard (experiment_ctrl_gui) or `ros2 param set` may change these
    # while the experiment runs; they apply from the NEXT trial. So may the cue blocks
    # (audio_cue_*, visual_cue) and a few experiment knobs -- the full list is
    # sinthlab_bringup/helpers/live_params.py. Everything else is fixed for the run.
    quiet_window_sec: 1.0      # at the start pose, before the go cue [s]; keep >= grasp.tare_sec
    audio_cue:  # switch for every beep
      enabled: true            # false = no beeps at all; the trial sequence is unchanged
    nsp_sync:  # event codes to the Blackrock NSP
      enabled: false           # send event codes to the Blackrock NSP -- needs the DIO (README §7)

    # Visual cue (NeoPixel ring on the end effector) -- see end_effector_metro_code/README.md.
    # What the cue LOOKS like is set on the board over its own Wi-Fi, not here.
    #
    #   enabled               master switch; false = no visual cues at all.
    #   remote_test_trigger   true  = fire each cue over Wi-Fi (GET http://192.168.4.1/cue).
    #                                 FOR DEMOS/RECORDINGS: join this computer to the board's
    #                                 KUKA_NEOPIXEL network first. The delay varies, so never
    #                                 align trial data to it.
    #                         false = the X76 wire at the robot base. No switch is wired to this
    #                                 computer yet, so nothing fires (a warning says so).
    visual_cue:  # NeoPixel ring cues; what they look like is set on the board itself
      enabled: true  # master switch for the ring; false = no visual cues at all
      remote_test_trigger: true  # true = fire over the board's Wi-Fi (demos); false = the X76 wire
      remote_board: "192.168.4.1"  # the cue board's address on its own Wi-Fi network (Wi-Fi trigger only)
      # Colour per cue event, [r, g, b, w] 0-255. Before each Wi-Fi cue it is set on the board with
      # /config (RAM only, never saved -- works with the firmware already on the board). The board's own
      # pattern, duration and brightness still apply. A site with no line keeps the board's current colour.
      colours:  # RGBW colour per cue site, each channel 0-255 (Wi-Fi trigger only)
        play: [0, 255, 0, 0]       # trial start -- green
        snap: [255, 0, 0, 0]       # pull threshold reached -- red
