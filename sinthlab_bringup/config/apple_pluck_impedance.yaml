/**:
  ros__parameters:
    # Apple-pluck drives a joint position controller (LBRJointPositionCommandController) via the
    # MoveToPositionJointSpace action; the cabinet (LbrImpedanceControlServer) provides compliance.
    apple_pluck_impedance_control_displacement:
      update_rate: 200
      base_frame: lbr_link_0
      ee_frame: lbr_link_ee
      cartesian_axis: z
      cartesian_displacement_threshold_m: 0.1
      force_release_shutdown_delay_sec: 0.8
      debug_log_enabled: false
      debug_log_rate_hz: 2.0
    move_to_start:
      update_rate: 200
      target_joint_position:
      - 0
      - 10
      - 0
      - -80
      - 0
      - 90
      - 0
      joint_move_tolerance: 0.01
      move_to_pos_v_max:  # peak joint speed [deg/s] (converted to rad/s in code)
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      debug_log_enabled: false
      debug_log_rate_hz: 2.0
    move_to_start_recover:
      update_rate: 200
      target_joint_position:
      - 0
      - 10
      - 0
      - -80
      - 0
      - 90
      - 0
      joint_move_tolerance: 0.15
      move_to_pos_v_max:  # peak joint speed [deg/s]
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      wait_for_physical_arrival: true
      debug_log_enabled: false
      debug_log_rate_hz: 2.0
    audio_cue_play:
      frequency_hz: 1500
      duration_ms: 1500
    audio_cue_snap:
      frequency_hz: 2000
      duration_ms: 500

    # Visual cue (NeoPixel ring on the end effector) -- see end_effector_metro_code/README.md.
    # This block carries TIMING ONLY: a trigger travels ROS -> cabinet cue server -> 24 V
    # media-flange line -> optocoupler -> the board, which then runs its cue and stops.
    #
    # WHAT THE CUE LOOKS LIKE IS NOT SET HERE. Colour, brightness, pattern, segments, duration and
    # rate live on the board and are set over its own Wi-Fi access point (join KUKA_NEOPIXEL from
    # a laptop or phone):
    #     curl "http://192.168.4.1/config?r=0&g=255&b=0&w=0&duration=1.2&save=1"
    # The trigger line is one bit and cannot carry a colour, and an experiment cue must not
    # depend on a radio link -- so appearance is a commissioning step, not a per-trial message.
    visual_cue:
      enabled: false                # <-- flip to true once the ring is wired and commissioned
      host: "172.31.1.147"          # cabinet IP on the KUKA network (the FRI peer)
      port: 30300
      pulse_ms: 0                   # 0 = bare trigger; the board's own `duration` owns the
                                    # length. Set this only if the board is in "follow" mode,
                                    # where the pulse width IS the cue length.
