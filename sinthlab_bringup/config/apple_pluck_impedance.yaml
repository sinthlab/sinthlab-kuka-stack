/**:
  ros__parameters:
    # ---- RESISTANCE of the pull: the felt stiffness, chosen per trial (dashboard slider) ----
    # The cabinet's stiffness is fixed by the SmartPad profile and ROS cannot change it. ROS SOFTENS it:
    # while the animal pulls, the arm's equilibrium follows part of the pull, so the spring stretches
    # less -- felt stiffness = base x (1 - fraction followed). It can only SOFTEN, never stiffen, and at
    # least 50 N/m of spring always remains. See actions/resistance_softener.py.
    #
    # >>> SmartPad: any profile -- e.g. "Maze compliant (uniform 400)" (400 N/m, rotation 300, like Uniform
    #     Medium but 4x stiffer translationally). Enter its translational stiffness below as the base: the
    #     slider then runs from 50 N/m up to the base, in steps of 10 (100, the usual feel, is mid-range
    #     on 400). The further below the base you go, the more a quick pull feels like the base (see below):
    #     choose a base near the stiffest you will actually use.
    #     base_stiffness_n_per_m MUST equal the profile's translational stiffness: if it says 400 while
    #     the SmartPad runs Uniform Medium (100), every pull feels 4x softer than the slider says.
    #     Equal values (stiffness = base) switch the softening off: the arm feels the bare profile.
    # Quick pulls feel somewhat stiffer than the setting (the equilibrium follows from ROS at 100 Hz,
    # slightly behind the arm), and at a fixed damping ratio a stiffer base is more damped -- pick a
    # lower damping ratio on the SmartPad if pulls feel viscous.
    resistance:  # felt stiffness of the pull
      base_stiffness_n_per_m: 400.0  # the SmartPad profile's translational stiffness [N/m] (per-run; must match the SmartPad)
      stiffness_n_per_m: 100.0  # felt stiffness of the pull [N/m] (live, from the next trial): 50 up to the base

    # Apple-pluck drives a joint position controller (LBRJointPositionCommandController) via the
    # MoveToPositionJointSpace action; the cabinet (LbrImpedanceControlServer) provides compliance.
    # ==== PARADIGM -- fixed for the run ====
    #   pluck    the pull from a fixed start: go cue -> pull -> threshold -> hold -> recover.
    #   perturb  the same, but after the go cue the apple is displaced by a polar (r, theta) offset
    #            (perturb_start, below), and the pull is measured from where it settles.
    # Dashboard: Apple Pluck -> "Pluck normal" / "Pluck perturb". Launch: paradigm:=perturb overrides it.
    # Every trial is recorded as experiment "apple_pluck", with this paradigm in its sidecar.
    paradigm: "pluck"  # pluck | perturb

    apple_pluck_impedance_control_displacement:  # pull monitor: baseline -> threshold (snap) -> hold -> recover
      update_rate: 200  # loop rate of this action [Hz]
      base_frame: lbr_link_0  # TF frame positions are measured in
      ee_frame: lbr_link_ee  # TF frame of the end effector being tracked
      # How far the apple must be pulled from its start to count as a pluck. `norm` is the straight-line
      # distance in any direction: the apple points at the monkey and is pulled toward it, so no single
      # base axis carries the pull. (x | y | z would measure just that base-frame axis.)
      cartesian_axis: norm  # how the pull is measured: norm = 3-D distance; x | y | z = that base axis only
      cartesian_displacement_threshold_m: 0.1  # pull from the baseline that counts as success (snap) [m]
      force_release_shutdown_delay_sec: 0.8  # after the snap, hold the arm frozen this long, then recover [s]
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]
    move_to_start:  # joint-space move to the trial start pose
      update_rate: 200  # loop rate of this action [Hz]
      # START POSE -- the apple points AT the monkey (+X), tilted 25 deg down, so the NeoPixel ring faces
      # the monkey too. Solved by IK against the iiwa7 URDF (lbr_link_0 -> lbr_link_ee):
      #   flange (0.40, 0, 0.75) m, apple centre ~(0.56, 0, 0.68) m, symmetric in-plane posture.
      #   6D condition number 11.5; every joint >= 24.7 deg from its limit; the arm can be pulled at
      #   least 0.30 m toward the monkey (along +X or along the apple) before nearing a limit or singularity.
      # KNOBS -- edit move_to_start AND move_to_start_recover together:
      #   A6 (6th value)  tilt. +10 -> 35 deg down (apple ~0.53, 0.63); -10 -> 15 deg down (apple ~0.58,
      #                   0.73). The apple pivots about the wrist.
      #   A7 (7th value)  turns the effector about its own axis without moving the apple, e.g. to put the
      #                   ring's dead quarter out of the monkey's view.
      #   height          [0, -13.6, 0, -85.5, 0, 43.1, 0]  -> apple ~5 cm higher (z ~0.73)
      #                   [0, -16.4, 0, -102.2, 0, 29.2, 0] -> apple ~5 cm lower (z ~0.63; A4 17 deg from its limit)
      #                   Lower than that, this posture cannot point the apple forward and down.
      target_joint_position:  # start pose, joint angles A1..A7 [deg]
      - 0.0
      - -15.5
      - 0.0
      - -94.3
      - 0.0
      - 36.2
      - 0.0
      joint_move_tolerance: 0.01  # done when every joint is within this of its target [rad]
      move_to_pos_v_max:  # peak joint speed [deg/s] (converted to rad/s in code)
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]
      wait_for_physical_arrival: false  # also wait for the MEASURED arm to arrive, not just the command
      cartesian_move_tolerance: 0.03  # EE within this of the target counts as physically arrived [m] (only when waiting)
      physical_arrival_timeout_sec: 0.0  # stop waiting for the measured arm after this long [s]; 0 = no limit
    move_to_start_recover:  # joint-space move back to the start at the end of each trial
      update_rate: 200  # loop rate of this action [Hz]
      # Same pose as move_to_start (see the notes there).
      target_joint_position:  # recover pose A1..A7 [deg], same as move_to_start
      - 0.0
      - -15.5
      - 0.0
      - -94.3
      - 0.0
      - 36.2
      - 0.0
      joint_move_tolerance: 0.15  # done when every joint is within this of its target [rad]
      move_to_pos_v_max:  # peak joint speed [deg/s]
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      wait_for_physical_arrival: true  # also wait for the MEASURED arm to arrive, not just the command
      # Physical arrival is judged by where the APPLE is, not by joint angles: the elbow can swing with the
      # apple exactly home (at this start a 1.6 cm elbow swing moves A1 by 0.15 rad), so a joint test can
      # wait forever after some pulls. If the arm is held off, carry on after the timeout (a warning says
      # how far off it was).
      cartesian_move_tolerance: 0.03      # apple within 3 cm of the start counts as arrived [m]
      physical_arrival_timeout_sec: 5.0   # stop waiting after this long [s]
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]
    # ==== PERTURB PARADIGM ONLY: the displacement of the apple after the go cue (live) ====
    # Used only when paradigm is "perturb"; shown on the dashboard only under Pluck perturb. To run
    # unperturbed trials inside a perturb run, set polar_r_m to 0 (live).
    perturb_start:  # the perturbation: polar offset from the start, jerk-limited joint move
      update_rate: 200  # loop rate of this action [Hz]
      # WHERE -- a POLAR offset (r, theta) from the start EE position, re-solved every trial by position
      # IK seeded at the start posture.
      #   polar_r_m        how far [m]. The apple points at the monkey, so keep it small.
      #   polar_plane      the plane theta turns in:
      #                      frontal    Y-Z, the plane FACING the monkey (theta from +Y toward +Z). The
      #                                 apple never moves toward or away from the monkey.
      #                      horizontal X-Y (theta from +X toward +Y); theta 0 = toward the monkey.
      #                      sagittal   X-Z (theta from +X toward +Z); theta 0 = toward the monkey.
      #   polar_theta_deg  direction in that plane. frontal: 0 = +Y (sideways), 90 = up, 180 = -Y
      #                    (the other side), 270 = down.
      #   polar_r_m is CAPPED PER PLANE: frontal 0.15, horizontal 0.175, sagittal 0.10 m. Checked by IK
      #   from this start pose, every direction in 15 deg steps: all solve exactly, stay >= 10 deg from
      #   every joint limit (>= 19 deg after a further 15 cm pull toward the monkey) and well conditioned
      #   (smallest singular value >= 0.10). The next step out breaks the 10 deg margin in each plane.
      #   Position-only IK lets the flange tilt: up to ~22 / 19 / 14 deg at the caps. The caps live in
      #   sinthlab_bringup/helpers/live_params.py (PERTURB_R_MAX); the dashboard and the orchestrator
      #   both enforce them, and the action warns if a solution still lands within 5 deg of a limit.
      polar_r_m: 0.05  # perturbation distance from the start [m]
      polar_theta_deg: 0.0  # perturbation direction within polar_plane [deg] (frontal: 0 = +Y, 90 = up)
      polar_plane: frontal  # plane theta turns in: frontal (Y-Z) | horizontal (X-Y) | sagittal (X-Z)
      joint_move_tolerance: 0.01  # done when every joint is within this of its target [rad]
      # HOW FAST -- a jerk-limited joint trajectory (ruckig) moving the impedance ANCHOR. On a move this
      # short the joints travel a few degrees, so ACCELERATION and JERK set the duration and the speed cap
      # never binds. Measured from the start pose, r = 0.05 m:
      #   a_max 2  / j_max 5    -> 0.73 s, peak 0.13 m/s   (these defaults)
      #   a_max 5  / j_max 20   -> 0.46 s, peak 0.20 m/s
      #   a_max 10 / j_max 50   -> 0.34 s, peak 0.28 m/s
      #   a_max 20 / j_max 150  -> 0.23 s, peak 0.40 m/s
      #   (v_max 20 or 80 instead of 40 changes none of these.) r = 0.10 m: 0.92 s at the defaults.
      # The physical apple follows the anchor through the impedance spring, so it lags a very fast move.
      move_to_pos_v_max:  # peak joint speed [deg/s], per joint
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      start_delay_sec: 1.5  # delay after the start cue before the perturbation move begins [s]
      # The arm must settle where the perturbation left it before the pull baseline locks (the monitor
      # starts as soon as the perturbation move completes, while the physical arm still lags it).
      baseline_settle_sec: 1.0  # wait after the perturbation before locking the pull baseline [s]
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]
      wait_for_physical_arrival: false  # also wait for the MEASURED arm to arrive, not just the command
      cartesian_move_tolerance: 0.03  # EE within this of the target counts as physically arrived [m] (only when waiting)
      physical_arrival_timeout_sec: 0.0  # stop waiting for the measured arm after this long [s]; 0 = no limit

    audio_cue_play:  # trial-start (go) tone
      frequency_hz: 1500  # trial-start (go) tone: pitch [Hz]
      duration_ms: 1500  # trial-start (go) tone: length [ms]
    audio_cue_snap:  # threshold-reached tone
      frequency_hz: 2000  # threshold-reached tone: pitch [Hz]
      duration_ms: 500  # threshold-reached tone: length [ms]

    # ---- LIVE parameters: the dashboard (experiment_ctrl_gui) or `ros2 param set` may change these
    # while the experiment runs; they apply from the NEXT trial. So may the cue blocks
    # (audio_cue_*, visual_cue) and a few experiment knobs -- the full list is
    # sinthlab_bringup/helpers/live_params.py. Everything else is fixed for the run.
    quiet_window_sec: 2.0      # at the start pose, before the go cue [s]
    audio_cue:  # switch for every beep
      enabled: true            # false = no beeps at all; the trial sequence is unchanged
    nsp_sync:  # event codes to the Blackrock NSP
      enabled: false           # send event codes to the Blackrock NSP -- needs the DIO (README §7)

    # Visual cue (NeoPixel ring on the end effector) -- see end_effector_metro_code/README.md.
    # What the cue LOOKS like is set on the board over its own Wi-Fi, not here.
    #
    #   enabled               master switch; false = no visual cues at all.
    #   remote_test_trigger   true  = fire each cue over Wi-Fi (GET http://192.168.4.1/cue).
    #                                 FOR DEMOS/RECORDINGS: join this computer to the board's
    #                                 KUKA_NEOPIXEL network first. The delay varies, so never
    #                                 align trial data to it.
    #                         false = the X76 wire at the robot base. No switch is wired to this
    #                                 computer yet, so nothing fires (a warning says so).
    visual_cue:  # NeoPixel ring cues; what they look like is set on the board itself
      enabled: true  # master switch for the ring; false = no visual cues at all
      remote_test_trigger: true  # true = fire over the board's Wi-Fi (demos); false = the X76 wire
      remote_board: "192.168.4.1"  # the cue board's address on its own Wi-Fi network (Wi-Fi trigger only)
      # Colour per cue event, [r, g, b, w] 0-255. Before each Wi-Fi cue it is set on the board with
      # /config (RAM only, never saved -- works with the firmware already on the board). The board's own
      # pattern, duration and brightness still apply. A site with no line keeps the board's current colour.
      colours:  # RGBW colour per cue site, each channel 0-255 (Wi-Fi trigger only)
        play: [0, 255, 0, 0]       # trial start -- green
        snap: [255, 0, 0, 0]       # pull threshold reached -- red
