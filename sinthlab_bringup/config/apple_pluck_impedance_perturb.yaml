/**:
  ros__parameters:
    # Perturb drives a joint position controller (LBRJointPositionCommandController) via the
    # MoveToPositionJointSpace / PerturbInitialPosition actions; the cabinet
    # (LbrImpedanceControlServer) provides the compliance.
    apple_pluck_impedance_control_displacement:
      update_rate: 200
      base_frame: lbr_link_0
      ee_frame: lbr_link_ee
      # How far the apple must be pulled from its start to count as a pluck. `norm` is the straight-line
      # distance in any direction: the apple points at the monkey and is pulled toward it, so no single
      # base axis carries the pull. (x | y | z would measure just that base-frame axis.)
      cartesian_axis: norm
      cartesian_displacement_threshold_m: 0.1   # same as apple_pluck_impedance.yaml
      # Wait for the arm to settle into the post-perturbation rest pose before locking the
      # displacement baseline (the monitor starts right after the perturbation move completes).
      baseline_settle_sec: 1.0
      force_release_shutdown_delay_sec: 0.8
      debug_log_enabled: false
      debug_log_rate_hz: 2.0
    # move_to_start and move_to_start_recover share the same home pose ON PURPOSE but differ in how
    # completion is judged (so they are NOT redundant copies):
    #   move_to_start        -> tight tol, commanded-only: finishes as soon as the COMMANDED anchor is
    #                           home (fast, precise/repeatable origin for the polar perturbation).
    #   move_to_start_recover -> looser tol + wait_for_physical_arrival: waits for the MEASURED arm to
    #                           physically return (so the next trial can't start at the perturbed pose).
    # If you edit the home pose, change it in BOTH blocks.
    move_to_start:
      update_rate: 200
      # Same start as apple_pluck_impedance.yaml -- apple pointing at the monkey, 15 deg down; the
      # notes and knobs for this pose are there. Keep all four copies identical.
      target_joint_position:
      - 0.0
      - -17.0
      - 0.0
      - -98.4
      - 0.0
      - 23.6
      - 0.0
      joint_move_tolerance: 0.01  # tight: commanded anchor must be home -> consistent perturbation origin
      move_to_pos_v_max:  # peak joint speed [deg/s] (converted to rad/s in code)
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      debug_log_enabled: false
      debug_log_rate_hz: 2.0
    perturb_start:
      update_rate: 200
      # WHERE -- a POLAR offset (r, theta) from the start EE position, re-solved every trial by position
      # IK seeded at the start posture.
      #   polar_r_m        how far [m]. The apple points at the monkey, so keep it small.
      #   polar_plane      the plane theta turns in:
      #                      frontal    Y-Z, the plane FACING the monkey (theta from +Y toward +Z). The
      #                                 apple never moves toward or away from the monkey.
      #                      horizontal X-Y (theta from +X toward +Y); theta 0 = toward the monkey.
      #                      sagittal   X-Z (theta from +X toward +Z); theta 0 = toward the monkey.
      #   polar_theta_deg  direction in that plane. frontal: 0 = +Y (sideways), 90 = up, 180 = -Y
      #                    (the other side), 270 = down.
      #   Checked from the start pose: every frontal direction at r = 0.05 and 0.10 m solves exactly
      #   (IK residual < 0.1 mm, condition number <= 17.3).
      polar_r_m: 0.05
      polar_theta_deg: 0.0
      polar_plane: frontal
      joint_move_tolerance: 0.01
      # HOW FAST -- a jerk-limited joint trajectory (ruckig) moving the impedance ANCHOR. On a move this
      # short the joints travel a few degrees, so ACCELERATION and JERK set the duration and the speed cap
      # never binds. Measured from the start pose, r = 0.05 m:
      #   a_max 2  / j_max 5    -> 0.73 s, peak 0.13 m/s   (these defaults)
      #   a_max 5  / j_max 20   -> 0.46 s, peak 0.20 m/s
      #   a_max 10 / j_max 50   -> 0.34 s, peak 0.28 m/s
      #   a_max 20 / j_max 150  -> 0.23 s, peak 0.40 m/s
      #   (v_max 20 or 80 instead of 40 changes none of these.) r = 0.10 m: 0.92 s at the defaults.
      # The physical apple follows the anchor through the impedance spring, so it lags a very fast move.
      move_to_pos_v_max:  # peak joint speed [deg/s], per joint
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2] -- raise for a snappier perturbation
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3] -- raise together with a_max
      start_delay_sec: 1.5  # delay after the start cue before the perturbation move begins [s]
      debug_log_enabled: false
      debug_log_rate_hz: 2.0
    move_to_start_recover:  # same home as move_to_start, but waits for the PHYSICAL arm to return
      update_rate: 200
      # Same pose as move_to_start (see the notes in apple_pluck_impedance.yaml).
      target_joint_position:
      - 0.0
      - -17.0
      - 0.0
      - -98.4
      - 0.0
      - 23.6
      - 0.0
      joint_move_tolerance: 0.15  # looser: the measured arm under impedance won't hit 0.01
      move_to_pos_v_max:  # peak joint speed [deg/s]
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      - 40.0
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      wait_for_physical_arrival: true  # wait for the MEASURED arm home, so the next trial can't start perturbed
      # Physical arrival is judged by where the APPLE is, not by joint angles: the elbow can swing with the
      # apple exactly home (at this start a 1.6 cm elbow swing moves A1 by 0.15 rad), and the joint test
      # used to leave this move waiting forever after some pulls. If the arm is held off, carry on after
      # the timeout (a warning says how far off it was).
      cartesian_move_tolerance: 0.03      # apple within 3 cm of the start counts as arrived [m]
      physical_arrival_timeout_sec: 5.0   # stop waiting after this long [s]
      debug_log_enabled: false
      debug_log_rate_hz: 2.0
    audio_cue_play:          # trial-start cue: monkey begins reaching, before the perturbation
      frequency_hz: 1500
      duration_ms: 1500
    audio_cue_snap:          # threshold-reached cue (pull success). (The post-perturbation "pull" cue was removed.)
      frequency_hz: 2000
      duration_ms: 500

    # Visual cue (NeoPixel ring on the end effector) -- see end_effector_metro_code/README.md.
    # What the cue LOOKS like is set on the board over its own Wi-Fi, not here.
    #
    #   enabled               master switch; false = no visual cues at all.
    #   remote_test_trigger   true  = fire each cue over Wi-Fi (GET http://192.168.4.1/cue).
    #                                 FOR DEMOS/RECORDINGS: join this computer to the board's
    #                                 KUKA_NEOPIXEL network first. The delay varies, so never
    #                                 align trial data to it.
    #                         false = the X76 wire at the robot base. No switch is wired to this
    #                                 computer yet, so nothing fires (a warning says so).
    visual_cue:
      enabled: true
      remote_test_trigger: true
      # Colour per cue event, [r, g, b, w] 0-255. Before each Wi-Fi cue it is set on the board with
      # /config (RAM only, never saved -- works with the firmware already on the board). The board's own
      # pattern, duration and brightness still apply. A site with no line keeps the board's current colour.
      colours:
        play: [0, 255, 0, 0]       # trial start -- green
        snap: [255, 0, 0, 0]       # pull threshold reached -- red
