/**/kuka_clik_controller:
  ros__parameters:
    # CLIK redundancy posture, in DEGREES (controller_base converts to rad).
    #
    # The CLIK matches only the EE *pose*; the iiwa's 7th DOF is resolved by biasing the arm toward this
    # configuration. So it MUST equal the experiment's own move_to_start.target_joint_position — otherwise
    # the arm reaches the right tool pose in a wrong-looking (or self-colliding) shape.
    #
    # This overlay is loaded AFTER iiwa7_hardware_controllers.yaml and overrides it, so each experiment
    # can carry its own posture instead of sharing one. This is the DEFAULT: apple-pluck / perturb /
    # restricted-plane, all of which start with the tool pointing DOWN (-Z).
    #   >>> SYNC with move_to_start.target_joint_position in:
    #       config/apple_pluck_impedance.yaml, apple_pluck_impedance_perturb.yaml,
    #       virtual_fixtures_params.yaml
    # The maze starts with the tool pointing along +X and uses clik_nullspace_maze.yaml instead.
    nullspace_desired_configuration: [0.0, 10.0, 0.0, -80.0, 0.0, 90.0, 0.0]
