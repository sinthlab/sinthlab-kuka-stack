/**/kuka_clik_controller:
  ros__parameters:
    # CLIK redundancy posture for the MAZE, in DEGREES (controller_base converts to rad).
    #
    # The CLIK matches only the EE *pose* and resolves the arm's redundant 7th DOF toward this posture.
    # It MUST equal maze_params.yaml move_to_start.target_joint_position — otherwise the arm holds the
    # right EE pose in a different arm shape and drifts toward this one while you drive the maze, which
    # feels like the fixture fighting you.
    #
    #   >>> SYNC with move_to_start.target_joint_position in config/maze_params.yaml.
    # EE ≈ (0.500, 0.000, 0.900) m in lbr_link_0, tool ≈ +X (tilted up ~10°).
    nullspace_desired_configuration: [-3.6, 69.9, -3.6, 70.0, 0.7, 79.5, -15.7]
