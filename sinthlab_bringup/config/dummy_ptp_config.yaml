/**:
  ros__parameters:

    # =========================================================================
    # dummy_ptp_config.yaml
    # Configuration for the dummy PTP (point-to-point) experiment.
    #
    # Joint angles are in DEGREES (the action converts to radians internally).
    # The 7 values correspond to joints [A1, A2, A3, A4, A5, A6, A7] of the
    # KUKA LBR iiwa7.
    #
    # *** PLACEHOLDER POSITIONS BELOW — measure and fill in real values. ***
    # To find safe joint angles: home the arm on the SmartPad, jog it to each
    # target pose manually, and read off the joint values from the FRI state.
    # =========================================================================

    # -------------------------------------------------------------------------
    # move_to_start
    # The "home" pose the arm returns to at the beginning of every trial.
    # Keep v_max conservative here — the arm may start from anywhere.
    # -------------------------------------------------------------------------
    move_to_start:
      update_rate: 200
      target_joint_position:    # [A1..A7] in degrees — FILL IN REAL VALUES
        - 0.0
        - 10.0
        - 0.0
        - -80.0
        - 0.0
        - 90.0
        - 0.0
      joint_move_tolerance: 0.01          # radians — arm is "arrived" within this
      move_to_pos_v_max:                  # peak speed per joint [deg/s]
        - 30.0
        - 30.0
        - 30.0
        - 30.0
        - 30.0
        - 30.0
        - 30.0
      move_to_pos_a_max: 2.0             # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0             # joint jerk limit [rad/s^3]
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # -------------------------------------------------------------------------
    # move_to_start_recover
    # Same target as move_to_start, but used at the END of each trial.
    # A looser tolerance is fine here (arm is already close).
    # You can increase v_max to speed up the inter-trial recovery if desired.
    # -------------------------------------------------------------------------
    move_to_start_recover:
      update_rate: 200
      target_joint_position:    # keep identical to move_to_start target
        - 0.0
        - 10.0
        - 0.0
        - -80.0
        - 0.0
        - 90.0
        - 0.0
      joint_move_tolerance: 0.05          # looser — arm is already near start
      move_to_pos_v_max:
        - 40.0
        - 40.0
        - 40.0
        - 40.0
        - 40.0
        - 40.0
        - 40.0
      move_to_pos_a_max: 2.0
      move_to_pos_j_max: 5.0
      wait_for_physical_arrival: true     # wait for physical joints, not just commanded
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # -------------------------------------------------------------------------
    # move_step1 .. move_step4
    # The four PTP positions. Set different v_max values to explore
    # what different speeds feel like on the arm.
    # -------------------------------------------------------------------------
    move_step1:
      update_rate: 200
      target_joint_position:    # FILL IN — first position
        - 20.0
        - 10.0
        - 0.0
        - -80.0
        - 0.0
        - 90.0
        - 0.0
      joint_move_tolerance: 0.01
      move_to_pos_v_max:
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 20.0
      move_to_pos_a_max: 2.0
      move_to_pos_j_max: 5.0
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    move_step2:
      update_rate: 200
      target_joint_position:    # FILL IN — second position
        - -20.0
        - 10.0
        - 0.0
        - -80.0
        - 0.0
        - 90.0
        - 0.0
      joint_move_tolerance: 0.01
      move_to_pos_v_max:
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 20.0
      move_to_pos_a_max: 2.0
      move_to_pos_j_max: 5.0
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    move_step3:
      update_rate: 200
      target_joint_position:    # FILL IN — third position
        - 0.0
        - 20.0
        - 0.0
        - -70.0
        - 0.0
        - 90.0
        - 0.0
      joint_move_tolerance: 0.01
      move_to_pos_v_max:
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 20.0
      move_to_pos_a_max: 2.0
      move_to_pos_j_max: 5.0
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    move_step4:
      update_rate: 200
      target_joint_position:    # FILL IN — fourth position
        - 0.0
        - 0.0
        - 0.0
        - -90.0
        - 0.0
        - 80.0
        - 0.0
      joint_move_tolerance: 0.01
      move_to_pos_v_max:
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 20.0
        - 20.0
      move_to_pos_a_max: 2.0
      move_to_pos_j_max: 5.0
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # -------------------------------------------------------------------------
    # Audio cues
    # audio_cue_ready  — plays once when the arm is at start, trial is about to begin
    # audio_cue_mid    — plays at each position hold
    # Frequency in Hz, duration in milliseconds.
    # -------------------------------------------------------------------------
    audio_cue_ready:
      frequency_hz: 880               # lower tone = "get ready"
      duration_ms: 600

    audio_cue_mid:
      frequency_hz: 1200              # mid tone = "arrived at position"
      duration_ms: 200