# Use of /** so that the configurations hold for controller
# managers regardless of their namespace.
/**/controller_manager:
  ros__parameters:
    update_rate: 100
    enforce_command_limits: true # can be removed from Kilted onward

    # ROS 2 control broadcasters
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    force_torque_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    # LBR ROS 2 control broadcasters
    estimated_wrench_interface:
      type: lbr_ros2_control/EstimatedWrenchInterface

    lbr_state_broadcaster:
      type: lbr_ros2_control/LBRStateBroadcaster

    # LBR ROS 2 control controllers.
    # lbr_joint_position_command_controller -> apple-pluck / perturb (joint positions -> FRI)
    lbr_joint_position_command_controller:
      type: lbr_ros2_control/LBRJointPositionCommandController

# ROS 2 control broadcasters
/**/force_torque_broadcaster:
  ros__parameters:
    frame_id: lbr_link_ee # note: frame_id must equal estimated_wrench_interface.wrench_estimator.chain_tip; namespace: https://github.com/ros2/rviz/issues/1103
    sensor_name: estimated_wrench_interface # note: name must equal estimated_wrench_interface node name (chained)

# LBR ROS 2 control broadcasters
/**/estimated_wrench_interface:
  ros__parameters:
    robot_name: lbr
    wrench_estimator:
      chain_root: lbr_link_0
      chain_tip: lbr_link_ee
      damping: 0.2
      force_x_th: 2.0
      force_y_th: 2.0
      force_z_th: 2.0
      torque_x_th: 0.5
      torque_y_th: 0.5
      torque_z_th: 0.5

/**/lbr_state_broadcaster:
  ros__parameters:
    robot_name: lbr

# LBR ROS 2 control controllers
/**/lbr_joint_position_command_controller:
  ros__parameters:
    robot_name: lbr

# ROS 2 control controllers
# kuka_clik_controller -> restricted-plane + maze (Cartesian equilibrium -> IK -> joint positions)
/**/kuka_clik_controller:
  ros__parameters:
    update_rate: 1000
    robot_base_link: "lbr_link_0"
    end_effector_link: "lbr_link_ee"
    compliance_ref_link: "lbr_link_ee"
    joints: [lbr_A1, lbr_A2, lbr_A3, lbr_A4, lbr_A5, lbr_A6, lbr_A7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    # >>> THE "STIFF WHILE MOVING" KNOB. These cap how fast the commanded EQUILIBRIUM may chase the
    # hand. Inside a fixture the equilibrium tracks the measured pose, so the spring error -- and the
    # force -- is ~zero. But if the operator moves FASTER than these clamps, the equilibrium falls
    # behind CUMULATIVELY, the error grows without bound, and K * error is felt as a wall in every
    # direction. That, not stiffness, is what made the maze feel stiff at every cabinet profile.
    # 1.0 m/s is comfortably above hand-guiding speed (~0.2-0.3 m/s), leaving only loop-latency lag
    # (force = K * v * latency, a few N) instead of an unbounded one.
    max_linear_velocity: 1.0
    max_angular_velocity: 0.5
    clik_dt: 0.001
    clik_it_max: 100
    clik_eps: 1e-4
    clik_filter_alpha: 0.99
