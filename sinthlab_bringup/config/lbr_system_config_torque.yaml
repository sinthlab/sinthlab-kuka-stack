# FRI system config for the TORQUE experiments (restricted-plane + maze).
# Identical to lbr_description/ros2_control/lbr_system_config.yaml EXCEPT client_command_mode: torque.
# Pair this with the Sunrise `TorqueControl` application (sunrise_controller_code/TorqueControl.java),
# which opens the FRI session as a JOINT overlay in TORQUE command mode with a zero-stiffness
# JointImpedanceControlMode -> the cabinet compensates gravity/friction/Coriolis and the ROS
# impedance controllers add joint torques on top. The apple-pluck/perturb experiments keep using the
# position config (lbr_description/ros2_control/lbr_system_config.yaml).
fri_client_sdk:
  major_version: 1
  minor_version: 15
client_command_mode: torque   # <-- the switch. Available: [position, torque, wrench]
port_id: 30200
remote_host: INADDR_ANY
rt_prio: 80
joint_position_tau: 0.04
command_guard:
  variant: default
state_guard:
  # Trips if the measured EXTERNAL joint torque exceeds the limit at the moment a compliant control
  # mode activates. It is a payload-calibration check: with a tool mounted, a trip means the tool's
  # loadData does not match reality -> re-run SmartPad "Determine" (see README section 2), do NOT
  # just raise this.
  #
  # 2.0 Nm (the lbr default) is too tight for a BARE FLANGE on this arm: with no payload, mass=0 is
  # already the correct model and the ~2.5 Nm seen on A2 is residual model/friction error in the
  # external-torque estimate, not an uncompensated load. 5.0 clears that without hiding a real one.
  #
  # >>> WHEN THE REAL END EFFECTOR IS MOUNTED: run Determine (tool attached, in a BENT posture -- not
  #     mechanical zero, where the wrist axes align with gravity and Determine records no usable
  #     data), copy the mass/COM into RoboticsAPI.data.xml so a project sync cannot wipe it, and
  #     consider lowering this back toward 2.0 so the check stays meaningful.
  external_torque_safety_check: true
  external_torque_limit: 5.0
external_torque_tau: 0.01
measured_torque_tau: 0.01
open_loop: true
