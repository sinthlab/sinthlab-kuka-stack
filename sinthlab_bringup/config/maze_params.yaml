/**:
  ros__parameters:
    # Maze runs in POSITION mode: move_to_start/move_to_park use MoveToPositionJointSpace, and MoveInMazeAction
    # streams the rail-constrained equilibrium to kuka_clik_controller. The CABINET
    # (LbrImpedanceControlServer) provides the compliance and holds the arm to the rails.
    #
    # >>> USE THE "X lock 2500, Y/Z 1000, rot 120" SmartPad profile.
    # It is anisotropic {2500, 1000, 1000, 120, 120, 120}. X 2500 locks the radial axis so the plane is
    # enforced in hardware; Y/Z 1000 hold the arm firmly on the rails; rot 120 is the knob that makes
    # guiding light. No uniform profile works: 400 gives walls too weak to feel (4 N/cm), and at 3000
    # tracking lag dominates. Rotational stiffness defines NOTHING about the maze (its constraints are
    # all translational), but holding orientation while translating is the expensive motion, so it is
    # the one lever that reduces effort without softening the plane or the rails.
    #
    # Tracking lag is a separate lever: the raised clamps (kuka_clik_controller.max_linear_velocity +
    # max_target_step_m below) are what stop the rails feeling heavy when you move fast.
    #
    # GEOMETRY IS SOLVED, NOT GUESSED. Every position below is in metres, base frame (lbr_link_0), and
    # was checked by IK against the real iiwa7 URDF: the start posture points the tool axis (the EE
    # frame's Z axis, the approach direction) exactly along +X, and every corridor of the maze is
    # reachable while HOLDING that orientation (the fixture locks orientation, so a corner the arm can
    # only reach by twisting the tool is unusable) -- diagnostics/check_maze.py, all rails sound.
    #
    # NOTE only the EE frame's local Z (the tool/approach axis) is the +X one -- read the third column
    # of the EE transform, not the first, when checking where the tool points.
    #
    # The start is the apple-pluck height, high and close to the arm's full stretch: the maze reaches
    # down and sideways from it, but there is only ~3 cm of room ABOVE it. If you move the maze, run
    # diagnostics/check_maze.py before trusting it.
    state_topic: "lbr_state"  # LBRState topic, relative to the robot namespace
    base_link: "lbr_link_0"  # URDF base link the fixture works in
    end_effector_link: "lbr_link_ee"  # URDF end-effector link the fixture constrains

    # Whole-experiment timeout [s]; on expiry the arm waits for release then returns to start.
    timeout_sec: 60.0  # trial time limit [s]; on expiry: timeout cue, wait for release, reset

    # The Sunrise app (LbrImpedanceControlServer) always PTPs the arm to mechanical zero and then a
    # ready pose in position control before ROS connects; the maze start is reachable from there.

    move_to_start:  # joint-space move to the trial start pose
      update_rate: 200  # loop rate of this action [Hz]
      # MAZE ENTRANCE / origin. The maze (corridors + checkpoints) is defined RELATIVE to this pose, so
      # this joint array is the one knob that positions the whole maze — change it and the maze follows.
      # EE (flange) ≈ (0.325, 0.000, 1.031) m -- the apple-pluck start height -- tool exactly +X. This
      # anchors the fixture: its X becomes the locked radial plane and this orientation is held for the
      # whole trial; the maze lives in the vertical Y-Z plane through the start (tool points +X,
      # perpendicular into it). Elbow NEGATIVE (A4 < 0), like the park pose and every other experiment.
      # >>> GUIDING COST: both fixtures LOCK ORIENTATION, and translating the EE while holding orientation
      #     is far harder in some postures than others. Measured cost of 1 m/s of pure translation with
      #     orientation held, ||qdot|| (full 6D Jacobian -- the linear part alone ignores the lock):
      #         this posture : ~6 sideways at the start, up to ~10 across the maze (check_maze.py)
      #         (a low elbow-positive start at z 0.9 was 2.5 .. 8; a "treacle" posture is 20-34)
      #     A search over the arm's redundancy found no cheaper elbow-negative posture at this hand pose.
      #     Rot stiffness (120) stays the knob that lightens guiding.
      # >>> SYNC: keep this array identical to nullspace_desired_configuration in
      #     config/clik_nullspace_maze.yaml, or the CLIK holds the right EE pose in the wrong arm
      #     posture and fights you.
      target_joint_position: [2.7, -9.9, -1.7, -52.0, -1.4, 47.9, -19.4]  # start pose, joint angles A1..A7 [deg]
      # >>> The maze anchors its ENTIRE geometry (corridors, checkpoints, goal) on the pose captured at
      #     the first fixture tick, so the arm must PHYSICALLY be at the start -- not merely commanded
      #     there. Without wait_for_physical_arrival the move completes on the COMMANDED trajectory
      #     alone, which on hardware can leave the arm ~2x outside a 0.01 rad tolerance (0.022 rad)
      #     and the whole maze offset from it.
      #     Tolerance is 0.03 rad (~1.7 deg, ~2 cm at the EE) rather than 0.01: under cabinet impedance
      #     there is always some steady-state joint error, and 0.01 would never be met, hanging the move.
      joint_move_tolerance: 0.03  # done when every joint is within this of its target [rad]
      wait_for_physical_arrival: true  # also wait for the MEASURED arm to arrive, not just the command
      cartesian_move_tolerance: 0.03   # EE position tolerance [m] to consider the move arrived
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]  # peak joint speed [deg/s]
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      speed_scale: 0.7  # LIVE, applies at once, from the next move: time-stretches this move -- 0.5 = twice as slow, 2 = twice as fast (0.25-2)
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]
      physical_arrival_timeout_sec: 0.0  # stop waiting for the measured arm after this long [s]; 0 = no limit
    # PARK -- where the arm waits between trials, out of the monkey's reach: the apple pulled back over
    # the robot's base, at ~(0.2, 0, 1.1) m in every experiment. The run's FIRST move goes here
    # from wherever the arm is (the SmartPad app's ready pose, or where a previous run left it); then
    # every trial is park -> start -> trial -> park. Pausing holds here.
    # The elbow-NEGATIVE posture (A4 < 0), like this experiment's start and every other experiment's: start
    # and park must bend the elbow the same way, or every park <-> start move passes a straight, singular
    # elbow (refused by the dashboard and at start-up). The SmartPad app's ready pose is elbow-negative
    # too, so no move in the run crosses it.
    move_to_park:  # joint-space move to the park pose: before the first trial and after every trial
      update_rate: 200  # loop rate of this action [Hz]
      target_joint_position: [0.0, -55.0, 0.0, -95.0, 0.0, 10.0, 0.0]  # park pose A1..A7 [deg] (per-run)
      joint_move_tolerance: 0.15  # done when every joint is within this of its target [rad]
      wait_for_physical_arrival: true  # also wait for the MEASURED arm to arrive, not just the command
      cartesian_move_tolerance: 0.05  # apple within this of the park pose counts as arrived [m]
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]  # peak joint speed, per joint [deg/s]
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      speed_scale: 1.0  # LIVE, applies at once, from the next move: time-stretches this move -- 0.5 = twice as slow, 2 = twice as fast (0.25-2)
      first_move_speed_scale: 1.0  # speed scale of the run's FIRST move here (per-run); this posture never crosses the straight elbow, so no need to crawl
      hold_sec: 2.0  # LIVE: how long the arm waits at park before moving to the next trial's start [s]
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]
      physical_arrival_timeout_sec: 10.0  # stop waiting for the measured arm after this long, with a warning [s]

    # Audio cues
    audio_cue_play:                 # "go" cue at trial start
      frequency_hz: 1500  # trial-start (go) tone: pitch [Hz]
      duration_ms: 1500  # trial-start (go) tone: length [ms]
    audio_cue_reward:               # reward at each checkpoint
      frequency_hz: 1800  # checkpoint-reward tone: pitch [Hz]
      duration_ms: 300  # checkpoint-reward tone: length [ms]
    audio_cue_goal:                 # maze solved
      frequency_hz: 2200  # maze-solved tone: pitch [Hz]
      duration_ms: 600  # maze-solved tone: length [ms]
    audio_cue_timeout:              # timed out
      frequency_hz: 800  # timed-out tone: pitch [Hz]
      duration_ms: 800  # timed-out tone: length [ms]

    # ---- LIVE parameters: the dashboard (experiment_ctrl_gui) or `ros2 param set` may change these
    # while the experiment runs; they apply from the NEXT trial. So may the cue blocks
    # (audio_cue_*, visual_cue) and a few experiment knobs -- the full list is
    # sinthlab_bringup/helpers/live_params.py. Everything else is fixed for the run.
    quiet_window_sec: 2.0      # at the start pose, before the go cue [s]
    audio_cue:  # switch for every beep
      enabled: true            # false = no beeps at all; the trial sequence is unchanged
    nsp_sync:  # event codes to the Blackrock NSP
      enabled: false           # send event codes to the Blackrock NSP -- needs the DIO (README §7)

    # Visual cue (NeoPixel ring on the end effector) -- see end_effector_metro_code/README.md.
    # What the cue LOOKS like is set on the board over its own Wi-Fi, not here.
    #
    #   enabled               master switch; false = no visual cues at all.
    #   remote_test_trigger   true  = fire each cue over Wi-Fi (GET http://192.168.4.1/cue).
    #                                 FOR DEMOS/RECORDINGS: join this computer to the board's
    #                                 KUKA_NEOPIXEL network first. The delay varies, so never
    #                                 align trial data to it.
    #                         false = the X76 wire at the robot base. No switch is wired to this
    #                                 computer yet, so nothing fires (a warning says so).
    visual_cue:  # NeoPixel ring cues; what they look like is set on the board itself
      enabled: true  # master switch for the ring; false = no visual cues at all
      remote_test_trigger: true  # true = fire over the board's Wi-Fi (demos); false = the X76 wire
      remote_board: "192.168.4.1"  # the cue board's address on its own Wi-Fi network (Wi-Fi trigger only)
      # Colour per cue event, [r, g, b, w] 0-255. Before each Wi-Fi cue it is set on the board with
      # /config (RAM only, never saved -- works with the firmware already on the board). The board's own
      # pattern, duration and brightness still apply. A site with no line keeps the board's current colour.
      colours:  # RGBW colour per cue site, each channel 0-255 (Wi-Fi trigger only)
        play: [0, 255, 0, 0]       # go -- green
        reward: [0, 0, 255, 0]     # checkpoint reward -- blue
        goal: [255, 0, 0, 0]       # maze solved (end) -- red
        timeout: [255, 0, 0, 0]    # timed out (end) -- red

    # Checkpoints (any order, reward once each) + goal. relative_to_start: true -> checkpoint_*/goal_*
    # are OFFSETS (metres) from the anchored start, EXACTLY matching the relative maze rails below
    # (keep both relative). They are placed on the maze fixture's own anchor -- taken after its
    # anchor_settle_sec -- so they sit exactly on the rails. The maze is in the Y-Z plane, so the X
    # offset is 0 (on the locked plane)
    # and Y/Z carry the position. Which junctions get a cue is explained at the arrays themselves.
    checkpoint_monitor:  # maze checkpoints (reward once each, any order) and the goal
      update_rate: 100  # loop rate of this action [Hz]
      base_frame: lbr_link_0  # TF frame positions are measured in
      ee_frame: lbr_link_ee  # TF frame of the end effector being tracked
      relative_to_start: true  # checkpoint and goal coordinates are offsets from the anchored start
      # CHECKPOINTS ONLY WHERE A TURN DECISION IS ACTUALLY MADE -- both forks.
      #
      #   ( a  ,  b  )  the choice
      #   (-0.15,-0.11) drop here for the SHORT route, or carry on left and drop at a=-0.30 (long)
      #   (-0.15,-0.22) turn right for the goal, or left along the bottom (the long way round)
      #
      # The midpoint of the descent rail is deliberately NOT a checkpoint: nothing branches there, so
      # there is nothing to decide. Every other junction is a forced corner and gets no cue either.
      checkpoint_x:      [ 0.000,  0.000]  # checkpoint X, one entry per checkpoint [m]
      checkpoint_y:      [-0.150, -0.150]  # checkpoint Y, one entry per checkpoint [m]
      checkpoint_z:      [-0.110, -0.220]  # checkpoint Z, one entry per checkpoint [m]
      checkpoint_radius: [ 0.040,  0.040]  # reward when the EE comes within this of the checkpoint [m]
      # On the plane
      goal_x: 0.000  # goal X [m]
      # Far (+Y) end of the BOTTOM goal row R5
      goal_y:  0.150  # goal Y [m]
      goal_z: -0.220  # goal Z [m]
      goal_radius: 0.03  # the goal is reached within this distance [m]
      debug_log_enabled: true  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]

    # Runaway safety-stop. Trips if the EE leaves the trial-start pose by more than max_displacement_m,
    # or exceeds max_speed_mps — the backstop the FRI velocity guard does NOT provide (it only neutralises
    # the command). On a trip the maze aborts immediately (no release wait) and drives back to start.
    # The maze footprint reaches ~0.45 m from start (the bottom-left corner), so 0.55 m clears it; normal hand motion is
    # comfortably below 0.7 m/s, so that threshold catches a fall/lurch without false-tripping. This is a backstop,
    # NOT a substitute for correct tool-load gravity compensation (mandatory for the vertical maze).
    maze_safety:  # runaway stop: abort to park if the arm goes too far or too fast
      update_rate: 100  # loop rate of this action [Hz]
      base_frame: lbr_link_0  # TF frame positions are measured in
      ee_frame: lbr_link_ee  # TF frame of the end effector being tracked
      max_displacement_m: 0.55  # abort if the EE gets farther than this from the trial start [m]
      max_speed_mps: 0.7  # abort if the EE moves faster than this [m/s]
      # Speed is a noisy single-sample TF difference; require this many consecutive over-threshold
      # samples (5 = 50 ms at 100 Hz) so jitter cannot trip the abort. Maze guiding is slow, so 0.7
      # stays appropriate here even with the raised CLIK clamp -- watch for false trips.
      speed_trip_samples: 5  # consecutive over-speed samples needed to trip (filters single-sample noise)
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]

    # Wait for the operator to let go (external force ~ 0) before parking.
    force_release:  # waits for the operator to let go before parking
      update_rate: 100  # loop rate of this action [Hz]
      release_force_threshold_newton: 3.0  # released when the external force stays below this [N]
      release_duration_sec: 1.0  # ... continuously for this long [s]
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]

    # =============================== MAZE GEOMETRY (VERTICAL Y-Z plane) ===============================
    # restricted_axis "x" locks the robot's RADIAL (in/out) axis and frees Y (sideways) + Z (up/down),
    # so the maze is a vertical "wall" in front of the robot that you drive by moving sideways and
    # up/down. The tool axis (the EE frame's Z axis) points ~+X, perpendicular into that plane, so the
    # apple still faces the subject.
    #
    # Rails are LINEAR segments in the two free axes (a, b): with restricted_axis "x", a = Y (sideways)
    # and b = Z (up/down). corridor_frame "relative" -> the numbers are OFFSETS (metres) from the
    # anchored start, so the whole maze moves with move_to_start. START is (0,0), on rail R1.
    # (checkpoint_monitor.relative_to_start matches, so rewards move with the walls.)
    #
    # Reachable envelope at this start, measured by IK holding the tool orientation:
    #   a in [-0.40, +0.40], b in [-0.35, +0.20], TRAPEZOIDAL (pinched at the top).
    # The maze sits ENTIRELY AT OR BELOW the start (b = 0 down to -0.33): the lower region is both
    # better conditioned for vertical motion and has gravity helping rather than fighting.
    #
    # Layout and solution: see the grid diagram in the `maze` profile below.
    # Short route 0.97 m; the long way round 1.27 m. Every vertical leg travelled DOWNWARD. There are NO dead ends -- every wrong turn is a loop that
    # rejoins the route, so it costs time rather than trapping the arm. Verified vs the URDF (optas
    # IK) by `ros2 run sinthlab_bringup check_maze.py`: every rail sampled reachable while holding the
    # start orientation, all junctions connected, START on a rail, all checkpoints + goal on rails.
    #
    # >>> DIAGNOSTIC LADDER. Switch `virtual_fixture_profile` between these to isolate WHY the maze
    # feels the way it does. They are all "maze" fixtures -- a rectangle spanning a whole region has no
    # walls inside it, and a long thin one IS a line -- so no code changes are needed.
    #
    #   free_plane  -> X locked, Y+Z free inside one big open rectangle (walls only at its edge).
    #                  Tests the PLANE LOCK + cabinet stiffness + tracking, with the rails removed.
    #                  Should feel like the sine rail's free axis: light to move sideways and up/down.
    #                  If THIS feels stiff, the problem is not the maze geometry at all.
    #   single_line -> one corridor, long in Y and thin in Z: a horizontal RAIL you slide along.
    #                  Adds exactly one wall pair (in Z). Free along Y, walled above/below.
    #   maze        -> the real thing.
    #
    # Work up the ladder and stop at the first one that feels wrong -- that names the culprit.
    virtual_fixture_profile: "maze"  # which block under virtual_fixtures is active
    virtual_fixtures:  # fixture geometries; virtual_fixture_profile picks the active one
      # Cap on commanded-equilibrium move per tick [m]. This is the SECOND tracking-lag clamp (the
      # first is kuka_clik_controller.max_linear_velocity): at ~100 Hz state, a small step (0.01 m/tick
      # = 1 m/s) becomes the binding constraint and the fixture feels stiff while moving. 0.05 keeps it
      # a jerk guard against spikes without throttling normal guiding.
      max_target_step_m: 0.05  # max move of the commanded equilibrium per tick [m] -- a jerk guard
      # Anchor the maze where the arm RESTS, not where it was commanded. A free axis carries no
      # restoring force, so the arm settles a few cm below the commanded start; anchored on the
      # commanded pose, the whole maze would sit that far above it and the checkpoints could be missed
      # (by ~1 cm against a 3 cm radius). 3 s captures most of the settle without stalling the trial.
      anchor_settle_sec: 3.0  # wait this long after the fixture starts before anchoring it [s]
      anchor_on_measured: true  # anchor on the measured pose (true) rather than the commanded one
      debug_log_enabled: false  # print where the arm is on the rails (a, b, which rail) periodically
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]
      # EASE OF MOVING ALONG A RAIL. Along a rail the spring force is zero except for tracking lag: the
      # equilibrium reaches the arm a few tens of ms late, and K * speed * lag is felt as drag. This
      # aims the equilibrium that many seconds AHEAD of the arm along the rail it is on: > 0 cancels
      # the lag (lighter), < 0 makes it trail (a deliberate, speed-dependent drag). It never acts
      # across a rail, so the walls are unchanged. Capped at 2 cm of lead. Start small: 0.01-0.03 s.
      rail_lead_sec: 0.0  # along-rail lead [s]: + easier (assist), - harder (drag), 0 off
      # --- rung 1: open rectangle, X locked, Y/Z free. Deliberately smaller than the full envelope
      #     (a +/-0.20, b -0.18..+0.14) so a drifting arm meets a wall rather than running to the
      #     workspace limit. Note this is a BOX, not a rail -- the only rung that is. ---
      free_plane:  # diagnostic rung 1: X locked, one open rectangle (walls only at its edge)
        type: "maze"  # geometry class: plane | cartesian_box | cylinder | sinusoid | maze
        restricted_axis: "x"  # locked base axis (x | y | z); the other two stay free
        corridor_frame: "relative"  # relative = offsets from the anchored start; absolute = base frame
        corridor_a_min: [-0.20]  # a (1st free axis) lower bound, per rail [m]
        corridor_a_max: [ 0.20]  # a (1st free axis) upper bound, per rail [m]
        corridor_b_min: [-0.18]  # b (2nd free axis) lower bound, per rail [m]
        corridor_b_max: [ 0.14]  # b (2nd free axis) upper bound, per rail [m]

      # --- rung 2: a single horizontal LINE along Y (thin in Z = one wall pair). ---
      single_line:  # diagnostic rung 2: one horizontal rail
        type: "maze"  # geometry class: plane | cartesian_box | cylinder | sinusoid | maze
        restricted_axis: "x"  # locked base axis (x | y | z); the other two stay free
        corridor_frame: "relative"  # relative = offsets from the anchored start; absolute = base frame
        corridor_a_min: [-0.06]  # a (1st free axis) lower bound, per rail [m]
        corridor_a_max: [ 0.19]  # a (1st free axis) upper bound, per rail [m]
        corridor_b_min: [-0.02]  # b (2nd free axis) lower bound, per rail [m]
        corridor_b_max: [ 0.02]  # b (2nd free axis) upper bound, per rail [m]

      # --- rung 3: the real maze ---
      maze:  # the maze: linear rails in the vertical Y-Z plane
        type: "maze"  # geometry class: plane | cartesian_box | cylinder | sinusoid | maze
        # Lock the radial X axis; free Y (sideways) + Z (up/down)
        restricted_axis: "x"  # locked base axis (x | y | z); the other two stay free
        corridor_frame: "relative"  # corridor coords are OFFSETS from the start EE (a=Y, b=Z)
        # ZERO-WIDTH (LINEAR) SEGMENTS. A horizontal leg has b_min == b_max, a vertical leg has
        # a_min == a_max, so each "corridor" is a LINE, not a box. The projection then always pulls the
        # equilibrium onto the nearest segment (exactly how the sine rail works), and the cabinet
        # spring holds the arm to it -- you slide ALONG a rail and must reach a junction to turn.
        #
        # Laid out inside the arm's ACTUAL reachable envelope at this start (measured by IK, holding
        # tool orientation): a in [-0.40,+0.40], b in [-0.35,+0.20]. That envelope is a TRAPEZOID --
        # full width low down, pinched at the top (at b=+0.20 only a in +/-0.10) -- so the grid stops
        # at b=+0.15 and the top row spans only a in [-0.15,+0.15].
        # A 2-D MAZE on a 0.15 m grid, ENTIRELY BELOW THE START so every vertical leg is travelled
        # DOWNWARD. Six rails, two forks, one loop, no dead ends.
        #
        # WHY BELOW: climbing is hard on this arm for two independent, measured reasons.
        #   1. The gravity-comp residual is a constant ~5.5 N DOWNWARD at the tool, so climbing fights
        #      it and descending is assisted.
        #   2. Vertical conditioning DEGRADES with height: the cost of 1 m/s of vertical motion with
        #      orientation held is 3.4 at b=-0.15 but 8.6 at b=+0.15 -- 2.5x the sideways cost.
        #
        # DEPTH IS 0.22 so the arm does not reach uncomfortably low: the goal row sits at z = 0.64 m in
        # the base frame (0.53 m at a 0.33 depth). A shallow maze beats RAISING the start, because a
        # higher start drags the start row into the badly-conditioned region (start-row vertical cost
        # 4.5 at this height, 6.9 if raised 0.10, 12.6 at 0.15); a shallow maze costs nothing.
        #
        #   a:      -0.30   -0.15    0.00    +0.15
        #  b  0.00                   >-------O          (R1 entrance, R2 down-link)
        #                                    |
        #  b -0.11   O-------1-------========O          (R3 long row)
        #            |       |                          (R6 far descent | R4 the single descent)
        #  b -0.22   O-------2-------========*GOAL      (R5 goal row)
        #
        #   1,2 = the two FORKS (the only cue points). O = forced corner. > = START, * = GOAL.
        #
        # R4 is a SINGLE rail from fork 1 straight down to fork 2 -- nothing branches off it in
        # between, so its midpoint is not a junction and gets no cue.
        #
        # THE CHOICE is which way down: drop at a=-0.15 (short) or carry on to a=-0.30 and drop there
        # (long). Both reach the goal row, so there are no dead ends -- a wrong choice costs travel.
        #   short route 0.97 m  |  long route 1.27 m
        #
        # Every rail verified reachable by IK holding the tool orientation. Re-check with:
        #     ros2 run sinthlab_bringup check_maze.py
        #
        #                R1     R2     R3     R4     R5     R6
        corridor_a_min: [ 0.00,  0.15, -0.30, -0.15, -0.30, -0.30]  # a (1st free axis) lower bound, per rail [m]
        corridor_a_max: [ 0.15,  0.15,  0.15, -0.15,  0.15, -0.30]  # a (1st free axis) upper bound, per rail [m]
        corridor_b_min: [ 0.00, -0.11, -0.11, -0.22, -0.22, -0.22]  # b (2nd free axis) lower bound, per rail [m]
        corridor_b_max: [ 0.00,  0.00, -0.11, -0.11, -0.22, -0.11]  # b (2nd free axis) upper bound, per rail [m]
