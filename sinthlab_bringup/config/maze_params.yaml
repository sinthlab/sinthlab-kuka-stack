/**:
  ros__parameters:
    # Maze runs in POSITION mode: move_to_start/recover use MoveToPositionJointSpace, and MoveInMazeAction
    # streams the corridor-constrained equilibrium to kuka_clik_controller. The CABINET
    # (LbrImpedanceControlServer) provides the compliance and the walls.
    #
    # >>> USE THE ANISOTROPIC "Maze walls (X lock, Y/Z firm)" SmartPad profile, not a uniform one.
    # Soft-inside does NOT come from low stiffness: inside a corridor the projection returns the measured
    # pose, so spring error -- and force -- is ~zero whatever K is. High K only bites at the walls. Every
    # uniform profile we tried failed for a different reason: 400 gave walls too weak to feel (4 N/cm),
    # 3000 was dominated by TRACKING LAG. The lag is fixed by the raised clamps (kuka_clik_controller
    # max_linear_velocity + max_target_step_m below), which lets X lock hard and Y/Z walls stay firm while
    # the interior stays free.
    #
    # GEOMETRY IS SOLVED, NOT GUESSED. Every position below is in metres, base frame (lbr_link_0), and
    # was checked by IK against the real iiwa7 URDF: the start posture points the tool axis (the EE
    # frame's Z axis, the approach direction) along +X to within ~11 deg, and all corridor corners are
    # reachable while HOLDING that orientation (the fixture locks orientation, so a corner the arm can
    # only reach by twisting the tool is unusable).
    #
    # NOTE the EE frame's other axes are NOT aligned with the base: local X is ~22 deg off straight
    # DOWN and local Y is ~base +Y. Only local Z (the tool/approach axis) is the ~+X one -- read the
    # third column of the EE transform, not the first, when checking where the tool points.
    #
    # The horizontal-tool pose costs reach: holding the tool along +X, the arm can only work in
    #   X in [0.50, 0.75], Y in [-0.25, +0.25]  at z = 0.50
    # (below X~0.50 the wrist folds back and the pose becomes unreachable). The whole maze lives inside
    # that box with margin. If you move the maze, re-run the reach check before trusting it.
    state_topic: "lbr_state"
    base_link: "lbr_link_0"
    end_effector_link: "lbr_link_ee"

    # Whole-experiment timeout [s]; on expiry the arm waits for release then returns to start.
    timeout_sec: 60.0

    # PRE-START WAYPOINT -- run ONCE at startup, before the first move to the maze start.
    #
    # WHY: MECHANICAL ZERO IS AN EXACTLY SINGULAR CONFIGURATION (smallest singular value of the
    # Jacobian is 0.0, condition number infinite -- the arm is fully extended straight up). The cabinet
    # runs Cartesian impedance, so a move commanded from there is ill-conditioned: the Jacobian has lost
    # rank and the 7-DOF nullspace is degenerate, so the arm does not reliably reach the maze start.
    # Observed on hardware: launching the maze from mechanical zero misses the start posture, while
    # running the restricted-plane experiment first (which parks the arm here) then makes it work.
    #
    # This posture is the restricted-plane start -- empirically proven to be reachable FROM mechanical
    # zero, and to be a configuration the maze start is reachable FROM. It is well conditioned
    # (smallest singular value 0.206 vs 0.0 at mechanical zero).
    #
    # Only the FIRST trial uses it; afterwards the arm is already at the maze start, so the recovery
    # move goes straight there and the trial loop is not slowed down.
    move_to_prestart:
      update_rate: 200
      target_joint_position: [0.0, 10.0, 0.0, -80.0, 0.0, 90.0, 0.0]
      joint_move_tolerance: 0.15   # loose: this is only a waypoint, not the experiment start
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]
      move_to_pos_a_max: 2.0
      move_to_pos_j_max: 5.0
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    move_to_start:
      update_rate: 200
      # MAZE ENTRANCE / origin. The maze (corridors + checkpoints) is defined RELATIVE to this pose, so
      # this joint array is the one knob that positions the whole maze — change it and the maze follows.
      # EE ≈ (0.500, 0.000, 0.900) m, tool ≈ +X. This anchors the fixture: its X (0.5) becomes the locked
      # radial plane and this orientation is held for the whole trial; the maze lives in the vertical Y-Z
      # plane through the start (tool points +X, perpendicular into it).
      # >>> WHY THIS POSTURE (changed 2026-08): the EE pose is IDENTICAL to the previous start
      #     [0,0,0,-70,-20,10,0] -- same position, same tool orientation -- but the arm reaches it with
      #     the elbow flipped. That matters because both fixtures LOCK ORIENTATION, and translating the
      #     EE while holding orientation is far harder in some postures than others. Measured cost of
      #     1 m/s of pure sideways (Y) translation with orientation held, ||qdot||:
      #         old posture: 19.8 at start, up to 33.6 across the maze   -> felt like treacle
      #         this one   :  2.5 at start, up to  8.2 across the maze   -> comparable to the sine rail
      #     (6D condition number 45.0 -> 10.1.) An earlier analysis picked the old posture using the
      #     LINEAR Jacobian only, which ignores the orientation lock and made Y look cheap (1.4).
      # >>> SYNC: keep this array identical to nullspace_desired_configuration in
      #     config/clik_nullspace_maze.yaml, or the CLIK holds the right EE pose in the wrong arm
      #     posture and fights you. (This start was verified: the whole maze footprint is reachable
      #     while holding this orientation at z=0.9.)
      target_joint_position: [-3.6, 69.9, -3.6, 70.0, 0.7, 79.5, -15.7]
      # >>> The maze anchors its ENTIRE geometry (corridors, checkpoints, goal) on the pose captured at
      #     the first fixture tick, so the arm must PHYSICALLY be at the start -- not merely commanded
      #     there. Without wait_for_physical_arrival the move completes on the COMMANDED trajectory
      #     alone; observed on hardware finishing at meas err 0.0219 rad against a 0.0100 tolerance,
      #     i.e. the arm was still ~2x outside tolerance and the whole maze was then offset from it.
      #     Tolerance is 0.03 rad (~1.7 deg, ~2 cm at the EE) rather than 0.01: under cabinet impedance
      #     there is always some steady-state joint error, and 0.01 would never be met, hanging the move.
      joint_move_tolerance: 0.03
      wait_for_physical_arrival: true
      cartesian_move_tolerance: 0.03   # EE position tolerance [m] to consider the move arrived
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]  # peak joint speed [deg/s]
      move_to_pos_a_max: 2.0  # [rad/s^2]
      move_to_pos_j_max: 5.0  # [rad/s^3]
      debug_log_enabled: false
      debug_log_rate_hz: 2.0
    move_to_start_recover:
      update_rate: 200
      target_joint_position: [-3.6, 69.9, -3.6, 70.0, 0.7, 79.5, -15.7]  # same as move_to_start
      joint_move_tolerance: 0.15
      wait_for_physical_arrival: true  # next trial must not start from a half-recovered pose
      cartesian_move_tolerance: 0.05
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]
      move_to_pos_a_max: 2.0
      move_to_pos_j_max: 5.0
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # Audio cues
    audio_cue_play:                 # "go" cue at trial start
      frequency_hz: 1500
      duration_ms: 1500
    audio_cue_reward:               # reward at each checkpoint
      frequency_hz: 1800
      duration_ms: 300
    audio_cue_goal:                 # maze solved
      frequency_hz: 2200
      duration_ms: 600
    audio_cue_timeout:              # timed out
      frequency_hz: 800
      duration_ms: 800

    # Checkpoints (any order, reward once each) + goal. relative_to_start: true -> checkpoint_*/goal_*
    # are OFFSETS (metres) from the start EE, captured on the first tick, EXACTLY matching the relative
    # maze corridors above (keep both relative). The maze is in the Y-Z plane, so the X offset is 0 (on
    # the locked plane) and Y/Z carry the position. CP1 = C1↔C3 junction; CP2 = C3↔C4 (top) junction.
    checkpoint_monitor:
      update_rate: 100
      base_frame: lbr_link_0
      ee_frame: lbr_link_ee
      relative_to_start: true
      checkpoint_x: [0.000, 0.000]   # X offset = 0 (on the locked plane)
      checkpoint_y: [0.320,  0.320]   # Y (sideways) offset from start
      checkpoint_z: [0.000, -0.300]   # Z (up/down) offset from start
      checkpoint_radius: [0.03, 0.03]
      goal_x: 0.000        # on the plane
      goal_y: -0.320       # far (−Y) end of the return leg C4
      goal_z: -0.300
      goal_radius: 0.03
      debug_log_enabled: true
      debug_log_rate_hz: 2.0

    # Runaway safety-stop. Trips if the EE leaves the trial-start pose by more than max_displacement_m,
    # or exceeds max_speed_mps — the backstop the FRI velocity guard does NOT provide (it only neutralises
    # the command). On a trip the maze aborts immediately (no release wait) and drives back to start.
    # The maze footprint now reaches ~0.44 m from start (the goal corner), so 0.60 m clears it; normal hand motion is
    # comfortably below 0.7 m/s, so that threshold catches a fall/lurch without false-tripping. This is a backstop,
    # NOT a substitute for correct tool-load gravity compensation (mandatory for the vertical maze).
    maze_safety:
      update_rate: 100
      base_frame: lbr_link_0
      ee_frame: lbr_link_ee
      max_displacement_m: 0.60
      max_speed_mps: 0.7
      # Speed is a noisy single-sample TF difference; require this many consecutive over-threshold
      # samples (5 = 50 ms at 100 Hz) so jitter cannot trip the abort. Maze guiding is slow, so 0.7
      # stays appropriate here even with the raised CLIK clamp -- watch for false trips.
      speed_trip_samples: 5
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # Wait for the operator to let go (external force ~ 0) before recovering to start.
    force_release:
      update_rate: 100
      release_force_threshold_newton: 3.0
      release_duration_sec: 1.0
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # =============================== MAZE GEOMETRY (VERTICAL Y-Z plane) ===============================
    # restricted_axis "x" locks the robot's RADIAL (in/out) axis — the one that is kinematically stiff at
    # a forward reach (~0.34 mobility here) — and frees Y (sideways) + Z (up/down), BOTH easy (~0.5). The
    # tool points +X, i.e. perpendicular INTO this plane, so the apple still faces the subject; the maze
    # is a vertical "wall" in front of the robot and you drive it by moving sideways and up/down. (A
    # horizontal X-Y maze forced the stiff radial X to be a free axis, which is why forward/back felt
    # frozen while sideways tracked fine.)
    #
    # Corridors are axis-aligned rectangles in the two free axes (a, b). With restricted_axis "x",
    # a = Y (sideways) and b = Z (up/down). corridor_frame "relative": the numbers are OFFSETS (metres)
    # from the START EE, so the maze origin is wherever the arm starts — change move_to_start and the
    # maze moves with it. START is (0,0), always inside C1. (checkpoint_monitor.relative_to_start matches.)
    #
    # Reachable box at this start: Y[±0.22], Z[-0.20,+0.16] (offsets). The maze spans Y[-0.15,0.19],
    # Z[-0.18,0.14] — enlarged to ~1.6x the earlier footprint for more room, still inside the box.
    #
    #  Z +0.12                    ╷ C2                                (C2 = dead-end UP, the wrong turn)
    #                              ╷
    #  Z  0.00        ▶START ──────┴──── C1 entrance +Y ──────► ① CP1
    #                                                          ╷
    #                                                          ╷ C3    (C3 = down-leg, gravity helps)
    #                                                          ╷
    #  Z -0.30        ★GOAL ◄──────── C4 return −Y ────────────┘ ② CP2
    #           Y:    -0.32        0     0.15                 0.32     <- Y offset (sideways)
    #           (all legs are LINES: you slide along a rail and turn only at a junction)
    #
    # Path: ▶START(0,0) —+Y 0.32→ ①CP1(0.320,0.00) —−Z down 0.30→ ②CP2(0.320,-0.300) —−Y 0.64→ ★GOAL(-0.320,-0.300).
    # Total 1.26 m of travel (2.0x the previous maze). C2 branches UP off C1 and dead-ends.
    # C2 branches −Z (down) off C1 and dead-ends. Checkpoints/goal are UNCHANGED; only the corridors grew.
    # Verified vs the URDF (optas IK): start inside C1, all four regions connected, every corner + both
    # checkpoints + goal reachable holding the start orientation, all inside the reachable Y-Z box.
    # >>> DIAGNOSTIC LADDER. Switch `virtual_fixture_profile` between these to isolate WHY the maze
    # feels the way it does. They are all "maze" fixtures -- a corridor spanning the whole workspace
    # simply has no walls, and a long thin corridor IS a line -- so no code changes are needed.
    #
    #   free_plane  -> X locked, Y+Z completely free (one huge corridor, no reachable wall).
    #                  Tests the PLANE LOCK + cabinet stiffness + tracking, with the corridors removed.
    #                  Should feel like the sine rail's free axis: light to move sideways and up/down.
    #                  If THIS feels stiff, the problem is not the maze geometry at all.
    #   single_line -> one corridor, long in Y and thin in Z: a horizontal RAIL you slide along.
    #                  Adds exactly one wall pair (in Z). Free along Y, walled above/below.
    #   maze        -> the real thing.
    #
    # Work up the ladder and stop at the first one that feels wrong -- that names the culprit.
    virtual_fixture_profile: "maze"
    virtual_fixtures:
      # Cap on commanded-equilibrium move per tick [m]. This is the SECOND tracking-lag clamp (the
      # first is kuka_clik_controller.max_linear_velocity): at 0.01 m/tick and ~100 Hz state the
      # equilibrium could only chase the hand at 1 m/s, but combined with the CLIK clamp it was the
      # binding constraint that made the fixture feel stiff while moving. 0.05 keeps it a jerk guard
      # against spikes without throttling normal guiding.
      max_target_step_m: 0.05
      # Anchor the maze where the arm RESTS, not where it was commanded. A free axis carries no
      # restoring force, so the arm settles a few cm below the commanded start; anchoring on the
      # commanded pose put the whole maze that far above it and the checkpoints were missed (CP1 by
      # ~1 cm against a 3 cm radius). 3 s captures most of the settle without stalling the trial.
      anchor_settle_sec: 3.0
      anchor_on_measured: true
      # --- rung 1: no walls at all (X locked, Y/Z free). Corridor covers the reachable box. ---
      free_plane:
        type: "maze"
        restricted_axis: "x"
        corridor_frame: "relative"
        corridor_a_min: [-0.20]
        corridor_a_max: [ 0.20]
        corridor_b_min: [-0.18]
        corridor_b_max: [ 0.14]

      # --- rung 2: a single horizontal LINE along Y (thin in Z = one wall pair). ---
      single_line:
        type: "maze"
        restricted_axis: "x"
        corridor_frame: "relative"
        corridor_a_min: [-0.06]
        corridor_a_max: [ 0.19]
        corridor_b_min: [-0.02]
        corridor_b_max: [ 0.02]

      # --- rung 3: the real maze ---
      maze:
        type: "maze"
        restricted_axis: "x"        # lock the radial X axis; free Y (sideways) + Z (up/down)
        corridor_frame: "relative"  # corridor coords are OFFSETS from the start EE (a=Y, b=Z)
        #                C1      C2      C3      C4
        # ZERO-WIDTH (LINEAR) SEGMENTS. A horizontal leg has b_min == b_max, a vertical leg has
        # a_min == a_max, so each "corridor" is a LINE, not a box. The projection then always pulls the
        # equilibrium onto the nearest segment (exactly how the sine rail works), and the cabinet
        # spring holds the arm to it -- you slide ALONG a rail and must reach a junction to turn.
        #
        # Laid out to the arm's ACTUAL reachable envelope at this start (measured by IK, holding tool
        # orientation): a in [-0.40,+0.40], b in [-0.35,+0.20]. That envelope is a TRAPEZOID -- full
        # width low down, narrowing badly at the top (at b=+0.20 only a in +/-0.10). So the long return
        # leg runs along the BOTTOM, which also means the big traverse is DOWNHILL: gravity helps
        # instead of fighting, which is what made the old upward C3 leg so hard.
        #                C1      C2      C3      C4
        corridor_a_min: [-0.05,  0.15,  0.32, -0.32]   # Y (sideways) offset min
        corridor_a_max: [ 0.32,  0.15,  0.32,  0.32]   # Y offset max
        corridor_b_min: [ 0.00,  0.00, -0.30, -0.30]   # Z (up/down) offset min
        corridor_b_max: [ 0.00,  0.12,  0.00, -0.30]   # Z offset max
