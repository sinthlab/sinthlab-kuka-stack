/**:
  ros__parameters:
    # Maze uses kuka_clik_controller (cartesian): move_to_start/recover use MoveToPositionCartesianSpace,
    # and MoveRestrictedOnAPlaneAction streams the corridor-constrained equilibrium pose. The cabinet
    # (LbrImpedanceControlServer) provides the walls — select a STIFF in-plane profile on the SmartPad
    # so the maze walls are firm and the path is strictly followed.
    #
    # GEOMETRY IS SOLVED, NOT GUESSED. Every position below is in metres, base frame (lbr_link_0), and
    # was checked by IK against the real iiwa7 URDF: the start posture puts the tool axis EXACTLY along
    # +X, and all 16 corridor corners are reachable while HOLDING that orientation (the fixture locks
    # orientation, so a corner the arm can only reach by twisting the tool is unusable).
    #
    # The horizontal-tool pose costs reach: holding the tool along +X, the arm can only work in
    #   X in [0.50, 0.75], Y in [-0.25, +0.25]  at z = 0.50
    # (below X~0.50 the wrist folds back and the pose becomes unreachable). The whole maze lives inside
    # that box with margin. If you move the maze, re-run the reach check before trusting it.
    state_topic: "lbr_state"
    base_link: "lbr_link_0"
    end_effector_link: "lbr_link_ee"

    # Whole-experiment timeout [s]; on expiry the arm waits for release then returns to start.
    timeout_sec: 60.0

    move_to_start:
      update_rate: 200
      # MAZE ENTRANCE / origin. The maze (corridors + checkpoints) is defined RELATIVE to this pose, so
      # this joint array is the one knob that positions the whole maze — change it and the maze follows.
      # EE ≈ (0.500, 0.000, 0.900) m, tool ≈ +X (tilted up ~10°). This anchors the fixture: its z (0.9)
      # becomes the locked maze plane and this orientation is held for the whole trial.
      # >>> SYNC: keep this array identical to nullspace_desired_configuration in
      #     config/clik_nullspace_maze.yaml, or the CLIK holds the right EE pose in the wrong arm
      #     posture and fights you. (This start was verified: the whole maze footprint is reachable
      #     while holding this orientation at z=0.9.)
      target_joint_position: [0.0, 0.0, 0.0, -70.0, -20.0, 10.0, 0.0]
      joint_move_tolerance: 0.01
      cartesian_move_tolerance: 0.03   # EE position tolerance [m] (clik completion)
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]  # peak joint speed [deg/s]
      move_to_pos_a_max: 2.0  # [rad/s^2]
      move_to_pos_j_max: 5.0  # [rad/s^3]
      debug_log_enabled: false
      debug_log_rate_hz: 2.0
    move_to_start_recover:
      update_rate: 200
      target_joint_position: [0.0, 0.0, 0.0, -70.0, -20.0, 10.0, 0.0]  # same as move_to_start
      joint_move_tolerance: 0.15
      cartesian_move_tolerance: 0.05
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]
      move_to_pos_a_max: 2.0
      move_to_pos_j_max: 5.0
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # Audio cues
    audio_cue_play:                 # "go" cue at trial start
      frequency_hz: 1500
      duration_ms: 1500
    audio_cue_reward:               # reward at each checkpoint
      frequency_hz: 1800
      duration_ms: 300
    audio_cue_goal:                 # maze solved
      frequency_hz: 2200
      duration_ms: 600
    audio_cue_timeout:              # timed out
      frequency_hz: 800
      duration_ms: 800

    # Checkpoints (any order, reward once each) + goal. relative_to_start: true -> checkpoint_*/goal_*
    # are OFFSETS (metres) from the start EE, captured on the first tick, EXACTLY matching the relative
    # maze corridors above (keep both relative). CP1 = C1↔C3 junction; CP2 = top of the final leg (C4).
    checkpoint_monitor:
      update_rate: 100
      base_frame: lbr_link_0
      ee_frame: lbr_link_ee
      relative_to_start: true
      checkpoint_x: [0.000, 0.065]   # X offset from start
      checkpoint_y: [0.100, 0.200]   # Y offset from start
      checkpoint_z: [0.000, 0.000]   # on the maze plane (0 = same z as start)
      checkpoint_radius: [0.03, 0.03]
      goal_x: 0.065        # offset from start — far end of the final leg (C4)
      goal_y: 0.230
      goal_z: 0.000
      goal_radius: 0.03
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # Wait for the operator to let go (external force ~ 0) before recovering to start.
    force_release:
      update_rate: 100
      release_force_threshold_newton: 3.0
      release_duration_sec: 1.0
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # ================================ MAZE GEOMETRY (X-Y plane) ================================
    # Corridors are axis-aligned rectangles in the two in-plane axes (a, b). restricted_axis "z" means
    # the plane is X-Y, so a = X, b = Y, and z is locked to the start height. The arm is FREE inside any
    # corridor and clamped to the nearest corridor edge outside them all — the cabinet's Cartesian
    # stiffness turns "outside a corridor" into a wall.
    #
    # corridor_frame: "relative" -> the numbers below are OFFSETS (metres) from the START EE. The maze
    # origin is therefore wherever the arm starts: change move_to_start and the maze moves with it, no
    # re-tuning. (checkpoint_monitor.relative_to_start does the same for the rewards/goal — keep both
    # relative or both absolute.) START is (0,0) by construction, so it is always inside C1.
    #
    # Laid out for the current start (EE ≈ (0.500, 0.000, 0.900), tool ≈ +X). At z=0.9 the reachable
    # box relative to start is Xrel[-0.16,+0.12], Yrel[±0.24] — LESS forward reach than at z=0.5 — so
    # the long runs go in +Y (roomy, and Y is an easy direction; X is the arm's stiffest here). 14 cm
    # corridors (±7 cm) so hand jitter doesn't pin you on the walls.
    #
    #  Yrel +0.23  ┌─────┐  ★GOAL
    #              │ C4  │                 (final up-leg, on the right)
    #  Yrel +0.14  ┌─────┼─────┐  ② at top of C4
    #              │ C3  │     │           (C3 = turn +X to reach C4)
    #  Yrel +0.07  │  ┌──┴─────┘
    #     ┌────────┴──┤ ① CP1  (C1↔C3 junction)
    #  C2 │  dead-end │ C1                 (C2 = wrong turn, branches −X off C1)
    #     └────────┬──┤
    #  Yrel -0.03     │ ▶START (0,0)
    #             -0.16 -0.07 0 0.10  <- Xrel
    #
    # Path: ▶START(0,0) —+Y→ ①CP1(0.00, 0.10) —+X→ (0.065, 0.10) —+Y→ ②CP2(0.065, 0.20) → ★GOAL(0.065, 0.23).
    # C2 branches −X off C1 and dead-ends.
    # Verified vs the URDF: start inside C1, all four regions connected, all 16 corners reachable while
    # holding the start orientation, everything inside the reachable box at z=0.9.
    virtual_fixture_profile: "maze"
    virtual_fixtures:
      max_target_step_m: 0.01   # cap on commanded-equilibrium move per tick [m] (jerk guard)
      maze:
        type: "maze"
        restricted_axis: "z"        # plane = X-Y; z locked to the start height
        corridor_frame: "relative"  # corridor coords are OFFSETS from the start EE (see above)
        #                C1      C2      C3      C4
        corridor_a_min: [-0.07, -0.16, -0.07,  0.03]   # X offset min
        corridor_a_max: [ 0.07, -0.05,  0.10,  0.10]   # X offset max
        corridor_b_min: [-0.03,  0.01,  0.07,  0.07]   # Y offset min
        corridor_b_max: [ 0.14,  0.11,  0.14,  0.24]   # Y offset max
