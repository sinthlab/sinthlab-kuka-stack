/**:
  ros__parameters:
    # Maze uses kuka_clik_controller (cartesian): move_to_start/recover use MoveToPositionCartesianSpace,
    # and MoveRestrictedOnAPlaneAction streams the corridor-constrained equilibrium pose. The cabinet
    # (LbrImpedanceControlServer) provides the walls — select a STIFF in-plane profile on the SmartPad
    # so the maze walls are firm and the path is strictly followed.
    #
    # GEOMETRY IS SOLVED, NOT GUESSED. Every position below is in metres, base frame (lbr_link_0), and
    # was checked by IK against the real iiwa7 URDF: the start posture puts the tool axis EXACTLY along
    # +X, and all 16 corridor corners are reachable while HOLDING that orientation (the fixture locks
    # orientation, so a corner the arm can only reach by twisting the tool is unusable).
    #
    # The horizontal-tool pose costs reach: holding the tool along +X, the arm can only work in
    #   X in [0.50, 0.75], Y in [-0.25, +0.25]  at z = 0.50
    # (below X~0.50 the wrist folds back and the pose becomes unreachable). The whole maze lives inside
    # that box with margin. If you move the maze, re-run the reach check before trusting it.
    state_topic: "lbr_state"
    base_link: "lbr_link_0"
    end_effector_link: "lbr_link_ee"

    # Whole-experiment timeout [s]; on expiry the arm waits for release then returns to start.
    timeout_sec: 60.0

    move_to_start:
      update_rate: 200
      # MAZE ENTRANCE / origin. The maze (corridors + checkpoints) is defined RELATIVE to this pose, so
      # this joint array is the one knob that positions the whole maze — change it and the maze follows.
      # EE ≈ (0.500, 0.000, 0.900) m, tool ≈ +X. This anchors the fixture: its X (0.5) becomes the locked
      # radial plane and this orientation is held for the whole trial; the maze lives in the vertical Y-Z
      # plane through the start (tool points +X, perpendicular into it).
      # >>> SYNC: keep this array identical to nullspace_desired_configuration in
      #     config/clik_nullspace_maze.yaml, or the CLIK holds the right EE pose in the wrong arm
      #     posture and fights you. (This start was verified: the whole maze footprint is reachable
      #     while holding this orientation at z=0.9.)
      target_joint_position: [0.0, 0.0, 0.0, -70.0, -20.0, 10.0, 0.0]
      joint_move_tolerance: 0.01
      cartesian_move_tolerance: 0.03   # EE position tolerance [m] (clik completion)
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]  # peak joint speed [deg/s]
      move_to_pos_a_max: 2.0  # [rad/s^2]
      move_to_pos_j_max: 5.0  # [rad/s^3]
      debug_log_enabled: false
      debug_log_rate_hz: 2.0
    move_to_start_recover:
      update_rate: 200
      target_joint_position: [0.0, 0.0, 0.0, -70.0, -20.0, 10.0, 0.0]  # same as move_to_start
      joint_move_tolerance: 0.15
      cartesian_move_tolerance: 0.05
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]
      move_to_pos_a_max: 2.0
      move_to_pos_j_max: 5.0
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # Audio cues
    audio_cue_play:                 # "go" cue at trial start
      frequency_hz: 1500
      duration_ms: 1500
    audio_cue_reward:               # reward at each checkpoint
      frequency_hz: 1800
      duration_ms: 300
    audio_cue_goal:                 # maze solved
      frequency_hz: 2200
      duration_ms: 600
    audio_cue_timeout:              # timed out
      frequency_hz: 800
      duration_ms: 800

    # Checkpoints (any order, reward once each) + goal. relative_to_start: true -> checkpoint_*/goal_*
    # are OFFSETS (metres) from the start EE, captured on the first tick, EXACTLY matching the relative
    # maze corridors above (keep both relative). The maze is in the Y-Z plane, so the X offset is 0 (on
    # the locked plane) and Y/Z carry the position. CP1 = C1↔C3 junction; CP2 = C3↔C4 (top) junction.
    checkpoint_monitor:
      update_rate: 100
      base_frame: lbr_link_0
      ee_frame: lbr_link_ee
      relative_to_start: true
      checkpoint_x: [0.000, 0.000]   # X offset = 0 (on the locked plane)
      checkpoint_y: [0.145, 0.145]   # Y (sideways) offset from start
      checkpoint_z: [0.000, 0.085]   # Z (up/down) offset from start
      checkpoint_radius: [0.03, 0.03]
      goal_x: 0.000        # on the plane
      goal_y: -0.060       # far (−Y) end of the return leg C4
      goal_z: 0.085
      goal_radius: 0.03
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # Runaway safety-stop. Trips if the EE leaves the trial-start pose by more than max_displacement_m,
    # or exceeds max_speed_mps — the backstop the FRI velocity guard does NOT provide (it only neutralises
    # the command). On a trip the maze aborts immediately (no release wait) and drives back to start.
    # The maze footprint is ≤ ~0.16 m from start, so 0.25 m clears it with margin; normal hand motion is
    # under the CLIK's 0.4 m/s clamp, so 0.7 m/s catches a fall without false-tripping. This is a backstop,
    # NOT a substitute for correct tool-load gravity compensation (mandatory for the vertical maze).
    maze_safety:
      update_rate: 100
      base_frame: lbr_link_0
      ee_frame: lbr_link_ee
      max_displacement_m: 0.25
      max_speed_mps: 0.7
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # Wait for the operator to let go (external force ~ 0) before recovering to start.
    force_release:
      update_rate: 100
      release_force_threshold_newton: 3.0
      release_duration_sec: 1.0
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # =============================== MAZE GEOMETRY (VERTICAL Y-Z plane) ===============================
    # restricted_axis "x" locks the robot's RADIAL (in/out) axis — the one that is kinematically stiff at
    # a forward reach (~0.34 mobility here) — and frees Y (sideways) + Z (up/down), BOTH easy (~0.5). The
    # tool points +X, i.e. perpendicular INTO this plane, so the apple still faces the subject; the maze
    # is a vertical "wall" in front of the robot and you drive it by moving sideways and up/down. (A
    # horizontal X-Y maze forced the stiff radial X to be a free axis, which is why forward/back felt
    # frozen while sideways tracked fine.)
    #
    # Corridors are axis-aligned rectangles in the two free axes (a, b). With restricted_axis "x",
    # a = Y (sideways) and b = Z (up/down). corridor_frame "relative": the numbers are OFFSETS (metres)
    # from the START EE, so the maze origin is wherever the arm starts — change move_to_start and the
    # maze moves with it. START is (0,0), always inside C1. (checkpoint_monitor.relative_to_start matches.)
    #
    # Reachable box at this start: Y[±0.22], Z[-0.20,+0.16] (offsets). 14 cm corridors (±7 cm).
    #
    #  Z +0.12  ★GOAL ┌──────────── C4 return ──────────┐ ② CP2       (top: return leg, −Y)
    #  Z +0.05        └───────────────────────────┐     │
    #                                             │ C3  │             (C3 = up-leg +Z, on the right)
    #  Z -0.07  ▶START ┌────────── C1 ────────────┤ ① CP1
    #                  │           entrance +Y    └─────┘
    #  Z -0.05        ┌┴────┐                                          (C2 = dead-end −Z, the wrong turn)
    #  Z -0.16        │ C2  │
    #                 └─────┘
    #           Y:  -0.08   0        0.11  0.18   <- Y offset (sideways)
    #
    # Path: ▶START(0,0) —+Y→ ①CP1(0.145,0.00) —+Z up→ ②CP2(0.145,0.085) —−Y→ ★GOAL(-0.06,0.085).
    # C2 branches −Z (down) off C1 and dead-ends.
    # Verified vs the URDF: start inside C1, all four regions connected, all 16 corners reachable holding
    # the start orientation, everything inside the reachable Y-Z box. Both free axes ~0.5 mobility.
    virtual_fixture_profile: "maze"
    virtual_fixtures:
      max_target_step_m: 0.01   # cap on commanded-equilibrium move per tick [m] (jerk guard)
      maze:
        type: "maze"
        restricted_axis: "x"        # lock the radial X axis; free Y (sideways) + Z (up/down)
        corridor_frame: "relative"  # corridor coords are OFFSETS from the start EE (a=Y, b=Z)
        #                C1      C2      C3      C4
        corridor_a_min: [-0.03,  0.01,  0.11, -0.08]   # Y (sideways) offset min
        corridor_a_max: [ 0.18,  0.11,  0.18,  0.18]   # Y offset max
        corridor_b_min: [-0.07, -0.16, -0.07,  0.05]   # Z (up/down) offset min
        corridor_b_max: [ 0.07, -0.05,  0.12,  0.12]   # Z offset max
