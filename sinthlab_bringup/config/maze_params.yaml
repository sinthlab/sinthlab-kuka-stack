/**:
  ros__parameters:
    # Maze uses kuka_clik_controller (cartesian): move_to_start/recover use MoveToPositionCartesianSpace,
    # and MoveRestrictedOnAPlaneAction streams the corridor-constrained equilibrium pose. The cabinet
    # (LbrImpedanceControlServer) provides the walls — select a STIFF in-plane profile on the SmartPad
    # so the maze walls are firm and the path is strictly followed.
    #
    # GEOMETRY IS SOLVED, NOT GUESSED. Every position below is in metres, base frame (lbr_link_0), and
    # was checked by IK against the real iiwa7 URDF: the start posture puts the tool axis EXACTLY along
    # +X, and all 16 corridor corners are reachable while HOLDING that orientation (the fixture locks
    # orientation, so a corner the arm can only reach by twisting the tool is unusable).
    #
    # The horizontal-tool pose costs reach: holding the tool along +X, the arm can only work in
    #   X in [0.50, 0.75], Y in [-0.25, +0.25]  at z = 0.50
    # (below X~0.50 the wrist folds back and the pose becomes unreachable). The whole maze lives inside
    # that box with margin. If you move the maze, re-run the reach check before trusting it.
    state_topic: "lbr_state"
    base_link: "lbr_link_0"
    end_effector_link: "lbr_link_ee"

    # Whole-experiment timeout [s]; on expiry the arm waits for release then returns to start.
    timeout_sec: 60.0

    move_to_start:
      update_rate: 200
      # MAZE ENTRANCE. Tool points along +X (horizontal, out from the base) — NOT down like every other
      # experiment. Solved by IK: EE = (0.540, 0.000, 0.500) m, tool axis = (+1, 0, 0) exactly. The arm
      # is planar (A1=A3=A5=A7=0) so the start posture is deterministic and faces straight forward.
      # This start also ANCHORS the fixture: z = 0.500 becomes the locked maze plane and this
      # orientation is held for the whole trial.
      # >>> SYNC: copy this array into config/clik_nullspace_maze.yaml, or the CLIK will hold the right
      #     tool pose in the wrong arm posture.
      target_joint_position: [0.0, 12.6, 0.0, -112.6, 0.0, -35.2, 0.0]
      joint_move_tolerance: 0.01
      cartesian_move_tolerance: 0.03   # EE position tolerance [m] (clik completion)
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]  # peak joint speed [deg/s]
      move_to_pos_a_max: 2.0  # [rad/s^2]
      move_to_pos_j_max: 5.0  # [rad/s^3]
      debug_log_enabled: false
      debug_log_rate_hz: 2.0
    move_to_start_recover:
      update_rate: 200
      target_joint_position: [0.0, 12.6, 0.0, -112.6, 0.0, -35.2, 0.0]  # same as move_to_start
      joint_move_tolerance: 0.15
      cartesian_move_tolerance: 0.05
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]
      move_to_pos_a_max: 2.0
      move_to_pos_j_max: 5.0
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # Audio cues
    audio_cue_play:                 # "go" cue at trial start
      frequency_hz: 1500
      duration_ms: 1500
    audio_cue_reward:               # reward at each checkpoint
      frequency_hz: 1800
      duration_ms: 300
    audio_cue_goal:                 # maze solved
      frequency_hz: 2200
      duration_ms: 600
    audio_cue_timeout:              # timed out
      frequency_hz: 800
      duration_ms: 800

    # Checkpoints (any order, reward once each) + goal. 3D spheres in base frame; z = the maze plane.
    # CP1 = the first corner (main corridor -> up leg); CP2 = the second corner (up leg -> return leg).
    checkpoint_monitor:
      update_rate: 100
      base_frame: lbr_link_0
      ee_frame: lbr_link_ee
      checkpoint_x: [0.68, 0.68]
      checkpoint_y: [0.00, 0.15]
      checkpoint_z: [0.50, 0.50]
      checkpoint_radius: [0.03, 0.03]
      goal_x: 0.55          # far end of the return leg
      goal_y: 0.15
      goal_z: 0.50
      goal_radius: 0.03
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # Wait for the operator to let go (external force ~ 0) before recovering to start.
    force_release:
      update_rate: 100
      release_force_threshold_newton: 3.0
      release_duration_sec: 1.0
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # ================================ MAZE GEOMETRY (X-Y plane) ================================
    # Corridors are axis-aligned rectangles in the two in-plane axes (a, b). restricted_axis "z" means
    # the plane is X-Y, so a = X, b = Y, and z is locked to the start height (0.500 m). The arm is FREE
    # inside any corridor and clamped to the nearest corridor edge outside them all — the cabinet's
    # Cartesian stiffness turns "outside a corridor" into a wall. Tessellate any maze into rectangles.
    #
    # CORRIDORS ARE 14 cm WIDE (not 8). The first cut used 8 cm (+-4 cm) corridors; the operator's hand
    # jitter exceeds 4 cm, so they were pinned against the lateral walls the whole time and every move
    # fought the ~1000 N/m spring — "free along the corridor, stiff across it". +-7 cm gives real room.
    # (Kinematics is NOT the cause: at these postures X is the arm's stiffest translational direction and
    # Y the easiest, i.e. the opposite of the reported feel — so the resistance was the walls, not the arm.)
    #
    #   Y +0.22  ┌──────────────────────────────┐         <- C4 return leg  (GOAL at its far end)
    #            │ ★GOAL                  ┌─────┤
    #   Y +0.08  └────────────────────────┤     │
    #                                     │ C3  │          <- C3 up leg
    #   Y +0.07  ┌────────────────────────┤ ②   │
    #            │ ▶START        C1        └─────┤
    #   Y -0.07  └────────┬─────────┬────────────┘         <- C1 entrance / main corridor
    #                     │         │
    #                     │   C2    │                      <- C2 DEAD END (the wrong turn)
    #   Y -0.22          └─────────┘
    #            0.52   0.56      0.68 0.74   <- X
    #
    # Path: START (0.54, 0.00) -> +X along C1 -> ①(0.68, 0.00) -> +Y up C3 -> ②(0.68, 0.15)
    #       -> -X back along C4 -> ★GOAL (0.55, 0.15).   C2 is a dead end branching off C1.
    # Verified vs the URDF: start inside C1, all four regions connected, all 16 corners reachable while
    # holding the tool along +X, everything inside the reachable box X[0.50,0.75] Y[+-0.25] at z=0.50.
    virtual_fixture_profile: "maze"
    virtual_fixtures:
      max_target_step_m: 0.01   # cap on commanded-equilibrium move per tick [m] (jerk guard)
      maze:
        type: "maze"
        restricted_axis: "z"    # plane = X-Y; z locked to the start pose (0.500 m)
        #                C1     C2     C3     C4
        corridor_a_min: [0.52,  0.56,  0.60,  0.52]   # X min of each corridor
        corridor_a_max: [0.74,  0.68,  0.74,  0.74]   # X max
        corridor_b_min: [-0.07, -0.22, -0.07,  0.08]  # Y min
        corridor_b_max: [ 0.07, -0.05,  0.22,  0.22]  # Y max
