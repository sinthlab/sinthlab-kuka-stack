# Controller config for the TORQUE experiments (restricted-plane + maze).
# Runs the idra-lab effort controllers (cartesian_impedance / joint_impedance) on the FRI
# torque overlay. The per-experiment stiffness map + nullspace posture are supplied by an OVERLAY
# file loaded AFTER this one (see the launch's `ctrl_overlay_cfg` arg):
#   config/torque_overlay_restricted_plane.yaml
#   config/torque_overlay_maze.yaml
#
# Orchestrator uses TWO controllers, switched at the move<->fixture boundary:
#   joint_impedance_controller  -> move-to-start / recover (target_frame = start EE pose, IK'd)
#   cartesian_impedance_controller -> the fixture phase (target_frame = corridor/rail-projected pose)
/**/controller_manager:
  ros__parameters:
    update_rate: 200         # MUST match TorqueControl.java send_period_ (200 Hz <-> 5 ms). 1 kHz/1 ms
                             # needs a real-time host; if FRI hangs in "Monitoring (Wait)", keep this lower.
    # NOTE: enforce_command_limits is deliberately NOT set here (upstream idra-lab's reference config
    # does not use it either). In torque mode it ran the Jazzy joint limiter over command interfaces the
    # controller had not written yet on the first update -> std::bad_optional_access -> the controller was
    # deactivated; it also clamped legitimate torques toward zero ("limited: effort: -0.000000").

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    force_torque_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster
    estimated_wrench_interface:
      type: lbr_ros2_control/EstimatedWrenchInterface
    lbr_state_broadcaster:
      type: lbr_ros2_control/LBRStateBroadcaster

    # idra-lab effort controllers (VENDORED in sinthlab-kuka-stack/ros2_effort_controller/)
    cartesian_impedance_controller:
      type: cartesian_impedance_controller/CartesianImpedanceController
    joint_impedance_controller:
      type: joint_impedance_controller/JointImpedanceController

# --- broadcasters / wrench estimator (same as the position config) ---
/**/force_torque_broadcaster:
  ros__parameters:
    frame_id: lbr_link_ee
    sensor_name: estimated_wrench_interface
/**/estimated_wrench_interface:
  ros__parameters:
    robot_name: lbr
    wrench_estimator:
      chain_root: lbr_link_0
      chain_tip: lbr_link_ee
      damping: 0.2
      force_x_th: 2.0
      force_y_th: 2.0
      force_z_th: 2.0
      torque_x_th: 0.5
      torque_y_th: 0.5
      torque_z_th: 0.5
/**/lbr_state_broadcaster:
  ros__parameters:
    robot_name: lbr

# --- CARTESIAN impedance = the fixture (soft where the operator guides, firm where it shouldn't move).
#     Gravity comp is on the CABINET (compensate_gravity: false here), so NO free-fall.
#     Stiffness here is a BASE default; the per-experiment overlay overrides trans_*/rot_* + nullspace.
/**/cartesian_impedance_controller:
  ros__parameters:
    command_current_configuration: true      # hold current pose on activate (no jump at the switch)
    robot_base_link: "lbr_link_0"
    end_effector_link: "lbr_link_ee"
    compliance_ref_link: "lbr_link_ee"
    ft_sensor_ref_link: "lbr_link_ee"
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    joints: [lbr_A1, lbr_A2, lbr_A3, lbr_A4, lbr_A5, lbr_A6, lbr_A7]
    delta_tau_max: 1.0
    compensate_gravity: false
    compensate_coriolis: false
    # BASE stiffness [N/m, Nm/rad] -- OVERRIDDEN per experiment. HARDWARE-TUNE these.
    stiffness:
      trans_x: 1000.0   # radial (in/out): stiff = the locked plane
      trans_y: 150.0    # sideways: soft (maze default; the rail overlay stiffens this)
      trans_z: 150.0    # up/down: soft
      rot_x: 30.0
      rot_y: 30.0
      rot_z: 30.0
    nullspace_stiffness: 0.0                  # overlay sets this + nullspace_desired_configuration

# --- JOINT impedance = move-to-start / recover. Reaches an EE pose (target_frame, IK'd) with a
#     joint-space spring. Stiffer than the fixture so the start posture is reached firmly.
/**/joint_impedance_controller:
  ros__parameters:
    command_current_configuration: true
    robot_base_link: "lbr_link_0"
    end_effector_link: "lbr_link_ee"
    compliance_ref_link: "lbr_link_ee"
    ft_sensor_ref_link: "lbr_link_ee"
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    joints: [lbr_A1, lbr_A2, lbr_A3, lbr_A4, lbr_A5, lbr_A6, lbr_A7]
    # per-joint stiffness [Nm/rad] -- HARDWARE-TUNE. Base joints stiffer than the wrist.
    stiffness:
      joint1: 200.0
      joint2: 200.0
      joint3: 200.0
      joint4: 200.0
      joint5: 100.0
      joint6: 100.0
      joint7: 100.0
    nullspace_stiffness: 0.0
    compensate_gravity: false
    compensate_coriolis: false
