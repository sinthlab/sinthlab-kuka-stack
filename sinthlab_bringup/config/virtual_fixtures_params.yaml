/**:
  ros__parameters:
    # Restricted-plane runs in POSITION mode: move_to_start/recover use MoveToPositionJointSpace, and
    # MoveRestrictedOnAPlaneAction streams the fixture-constrained equilibrium to kuka_clik_controller.
    # The CABINET (LbrImpedanceControlServer) provides the compliance -- pair with "Rail guide
    # (uniform 1000)". This scenario already worked; the raised CLIK clamps only make the rail easier
    # to pull at speed.
    state_topic: "lbr_state"
    base_link: "lbr_link_0"
    end_effector_link: "lbr_link_ee"

    move_to_start:
      update_rate: 200
      # Tool points down -Z. Matches the apple-pluck/perturb start exactly.
      target_joint_position: [0.0, 10.0, 0.0, -80.0, 0.0, 90.0, 0.0]
      cartesian_move_tolerance: 0.03   # EE position tolerance [m] to consider the move arrived
      joint_move_tolerance: 0.01
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]  # peak joint speed [deg/s]
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    audio_cue_play:
      frequency_hz: 1500
      duration_ms: 1500
    apple_pluck_impedance_control_displacement:
      update_rate: 200
      base_frame: lbr_link_0
      ee_frame: lbr_link_ee
      cartesian_axis: z
      cartesian_displacement_threshold_m: 0.5
      force_release_shutdown_delay_sec: 0.8
      debug_log_enabled: false
      debug_log_rate_hz: 2.0
    move_to_start_recover:
      update_rate: 200
      target_joint_position: [0.0, 10.0, 0.0, -80.0, 0.0, 90.0, 0.0]  # same start pose as move_to_start
      cartesian_move_tolerance: 0.03
      joint_move_tolerance: 0.15
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]  # peak joint speed [deg/s]
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      wait_for_physical_arrival: true
      debug_log_enabled: false
      debug_log_rate_hz: 2.0
    audio_cue_snap:
      frequency_hz: 2000
      duration_ms: 500

    # Runaway safety-stop (backstop for a gravity-driven fall on the free pull axis, which the FRI
    # velocity guard does not halt). On a trip the trial aborts straight to recovery.
    #   max_displacement_m: the sine pull legitimately travels up to the displacement-monitor threshold
    #     (0.5 m in z), so this only trips well beyond that.
    #   max_speed_mps: must clear a brisk legitimate pull. The CLIK lets the commanded equilibrium chase
    #     the hand at up to max_linear_velocity (1.0 m/s), so the arm can legitimately move near that --
    #     1.2 was calibrated back when that clamp was 0.4 and now false-trips. 1.8 still catches a fall
    #     (free fall passes 1.8 m/s in ~0.18 s / 16 cm).
    #   speed_trip_samples: speed is a single-sample TF difference and therefore noisy; require this many
    #     CONSECUTIVE over-threshold samples (5 = 50 ms at 100 Hz) so jitter cannot trip the abort.
    plane_safety:
      update_rate: 100
      base_frame: lbr_link_0
      ee_frame: lbr_link_ee
      max_displacement_m: 0.7
      max_speed_mps: 1.8
      speed_trip_samples: 5
      debug_log_enabled: false
      debug_log_rate_hz: 2.0

    # Selects which fixture geometry below is active; switch this to change the constraint.
    virtual_fixture_profile: "sine_wave"
    virtual_fixtures:
      # The KUKA cabinet runs Cartesian impedance (run LbrImpedanceControlServer on the SmartPad);
      # this node streams the fixture-constrained equilibrium pose.
      # Cap on commanded-equilibrium move per tick [m]. This is the SECOND tracking-lag clamp (the
      # first is kuka_clik_controller.max_linear_velocity): at 0.01 m/tick and ~100 Hz state the
      # equilibrium could only chase the hand at 1 m/s, but combined with the CLIK clamp it was the
      # binding constraint that made the fixture feel stiff while moving. 0.05 keeps it a jerk guard
      # against spikes without throttling normal guiding.
      max_target_step_m: 0.05
      simple_plane:
        type: "plane"
        restricted_axis: "y" # "x", "y", or "z"
      bounding_box:
        type: "cartesian_box"
        z_min: 0.3
        x_min: 0.2
        x_max: 0.5
      flat_table:
        type: "cartesian_box"
        z_min: 0.3
      cylinder_tube:
        type: "cylinder"
        radius: 0.4
        center_x: 0.0
        center_y: 0.0
      sine_wave:
        type: "sinusoid"
        # Rail: y = start_y + amplitude * sin(spatial_freq * (z - start_z)). The operator pulls along
        # z (free: the equilibrium tracks measured z); x is pinned and y is dragged onto the rail.
        #
        # SIZE THE WAVELENGTH AGAINST THE PULL STROKE or there is no sinusoid to feel. The operator only
        # ever traverses `stroke` metres of the wave, so what they experience is
        # stroke / (2*pi/spatial_freq) periods of it. Below ~1 period it reads as a straight lean:
        #
        #   0.03 / 12.0 -> 52 cm wavelength -> 0.38 periods over a 20 cm pull: ONE shallow 3 cm bulge
        #                                      that never comes back. Felt as "it just went straight."
        #   0.04 / 30.0 -> 21 cm wavelength -> 0.95 periods over a 20 cm pull: -4 cm, back through 0,
        #                                      +4 cm. An actual there-and-back wave.
        #
        # FORCE is set by AMPLITUDE, not by wavelength. Pulling straight down and ignoring the rail puts
        # you at most `amplitude` off it, so the worst case is K_y * amplitude = 40 N at 1000 N/m. The
        # steeper slope (amplitude*spatial_freq = 1.2, a 50 deg rail) costs no extra force — it only
        # makes the wave tighter. But it DOES demand lateral speed: v_y = slope * v_pull, so the CLIK's
        # max_linear_velocity must exceed it or the rail gets rate-limited flat (now 1.0 m/s).
        # Pair with the "Rail guide (uniform 1000)" cabinet profile.
        # History: the original 0.1 / 20.0 was slope 2.0 (63 deg) and a 10 cm error = 300 N at "Stiff" —
        # it would have slammed the arm sideways and tripped the cabinet.
        amplitude: 0.04
        spatial_freq: 30.0
        pull_axis: "z"
        osc_axis: "y"
