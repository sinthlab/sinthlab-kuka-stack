/**:
  ros__parameters:
    # Restricted-plane runs in POSITION mode: move_to_start/recover use MoveToPositionJointSpace, and
    # MoveRestrictedOnAPlaneAction streams the fixture-constrained equilibrium to kuka_clik_controller.
    # The CABINET (LbrImpedanceControlServer) provides the compliance -- pair with "Rail guide
    # (uniform 1000)". This scenario already worked; the raised CLIK clamps only make the rail easier
    # to pull at speed.
    state_topic: "lbr_state"  # LBRState topic, relative to the robot namespace
    base_link: "lbr_link_0"  # URDF base link the fixture works in
    end_effector_link: "lbr_link_ee"  # URDF end-effector link the fixture constrains

    move_to_start:  # joint-space move to the trial start pose
      update_rate: 200  # loop rate of this action [Hz]
      # Tool points down -Z. (Apple pluck and perturb start with the apple pointing at the monkey
      # instead -- see apple_pluck_impedance.yaml.)
      target_joint_position: [0.0, 10.0, 0.0, -80.0, 0.0, 90.0, 0.0]  # start pose, joint angles A1..A7 [deg]
      cartesian_move_tolerance: 0.03   # EE position tolerance [m] to consider the move arrived
      joint_move_tolerance: 0.01  # done when every joint is within this of its target [rad]
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]  # peak joint speed [deg/s]
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]

    audio_cue_play:  # trial-start (go) tone
      frequency_hz: 1500  # trial-start (go) tone: pitch [Hz]
      duration_ms: 1500  # trial-start (go) tone: length [ms]
    apple_pluck_impedance_control_displacement:  # pull monitor: baseline -> threshold (snap) -> hold -> recover
      update_rate: 200  # loop rate of this action [Hz]
      base_frame: lbr_link_0  # TF frame positions are measured in
      ee_frame: lbr_link_ee  # TF frame of the end effector being tracked
      cartesian_axis: z  # how the pull is measured: norm = 3-D distance; x | y | z = that base axis only
      cartesian_displacement_threshold_m: 0.5  # pull from the baseline that counts as success (snap) [m]
      force_release_shutdown_delay_sec: 0.8  # after the snap, hold the arm frozen this long, then recover [s]
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]
    move_to_start_recover:  # joint-space move back to the start at the end of each trial
      update_rate: 200  # loop rate of this action [Hz]
      target_joint_position: [0.0, 10.0, 0.0, -80.0, 0.0, 90.0, 0.0]  # recover pose A1..A7 [deg], same as move_to_start
      cartesian_move_tolerance: 0.03  # EE within this of the target counts as physically arrived [m]
      joint_move_tolerance: 0.15  # done when every joint is within this of its target [rad]
      move_to_pos_v_max: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]  # peak joint speed [deg/s]
      move_to_pos_a_max: 2.0  # joint acceleration limit [rad/s^2]
      move_to_pos_j_max: 5.0  # joint jerk limit [rad/s^3]
      wait_for_physical_arrival: true  # also wait for the MEASURED arm to arrive, not just the command
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]
    audio_cue_snap:  # threshold-reached tone
      frequency_hz: 2000  # threshold-reached tone: pitch [Hz]
      duration_ms: 500  # threshold-reached tone: length [ms]

    # ---- LIVE parameters: the dashboard (experiment_ctrl_gui) or `ros2 param set` may change these
    # while the experiment runs; they apply from the NEXT trial. So may the cue blocks
    # (audio_cue_*, visual_cue) and a few experiment knobs -- the full list is
    # sinthlab_bringup/helpers/live_params.py. Everything else is fixed for the run.
    quiet_window_sec: 2.0      # at the start pose, before the go cue [s]
    audio_cue:  # switch for every beep
      enabled: true            # false = no beeps at all; the trial sequence is unchanged
    nsp_sync:  # event codes to the Blackrock NSP
      enabled: false           # send event codes to the Blackrock NSP -- needs the DIO (README §7)

    # Visual cue (NeoPixel ring on the end effector) -- see end_effector_metro_code/README.md.
    # What the cue LOOKS like is set on the board over its own Wi-Fi, not here.
    #
    #   enabled               master switch; false = no visual cues at all.
    #   remote_test_trigger   true  = fire each cue over Wi-Fi (GET http://192.168.4.1/cue).
    #                                 FOR DEMOS/RECORDINGS: join this computer to the board's
    #                                 KUKA_NEOPIXEL network first. The delay varies, so never
    #                                 align trial data to it.
    #                         false = the X76 wire at the robot base. No switch is wired to this
    #                                 computer yet, so nothing fires (a warning says so).
    visual_cue:  # NeoPixel ring cues; what they look like is set on the board itself
      enabled: false  # master switch for the ring; false = no visual cues at all
      remote_test_trigger: true  # true = fire over the board's Wi-Fi (demos); false = the X76 wire
      # Colour per cue event, [r, g, b, w] 0-255 -- as in apple_pluck_impedance.yaml. Present even
      # while the ring is off so the dashboard can change it live.
      colours:  # RGBW colour per cue site, each channel 0-255 (Wi-Fi trigger only)
        play: [0, 255, 0, 0]       # trial start -- green
        snap: [255, 0, 0, 0]       # pull threshold reached -- red

    # Runaway safety-stop (backstop for a gravity-driven fall on the free pull axis, which the FRI
    # velocity guard does not halt). On a trip the trial aborts straight to recovery.
    #   max_displacement_m: the sine pull legitimately travels up to the displacement-monitor threshold
    #     (0.5 m in z), so this only trips well beyond that.
    #   max_speed_mps: must clear a brisk legitimate pull. The CLIK lets the commanded equilibrium chase
    #     the hand at up to max_linear_velocity (1.0 m/s), so the arm can legitimately move near that and
    #     a limit near 1.2 false-trips. 1.8 still catches a fall (free fall passes 1.8 m/s in ~0.18 s /
    #     16 cm).
    #   speed_trip_samples: speed is a single-sample TF difference and therefore noisy; require this many
    #     CONSECUTIVE over-threshold samples (5 = 50 ms at 100 Hz) so jitter cannot trip the abort.
    plane_safety:  # runaway stop: abort to recovery if the arm goes too far or too fast
      update_rate: 100  # loop rate of this action [Hz]
      base_frame: lbr_link_0  # TF frame positions are measured in
      ee_frame: lbr_link_ee  # TF frame of the end effector being tracked
      max_displacement_m: 0.7  # abort if the EE gets farther than this from the trial start [m]
      max_speed_mps: 1.8  # abort if the EE moves faster than this [m/s]
      speed_trip_samples: 5  # consecutive over-speed samples needed to trip (filters single-sample noise)
      debug_log_enabled: false  # print this action's periodic debug line
      debug_log_rate_hz: 2.0  # how often that debug line prints [Hz]

    # Selects which fixture geometry below is active; switch this to change the constraint.
    virtual_fixture_profile: "sine_wave"  # which block under virtual_fixtures is active
    virtual_fixtures:  # fixture geometries; virtual_fixture_profile picks the active one
      # The KUKA cabinet runs Cartesian impedance (run LbrImpedanceControlServer on the SmartPad);
      # this node streams the fixture-constrained equilibrium pose.
      # Cap on commanded-equilibrium move per tick [m]. This is the SECOND tracking-lag clamp (the
      # first is kuka_clik_controller.max_linear_velocity): at ~100 Hz state, a small step (0.01 m/tick
      # = 1 m/s) becomes the binding constraint and the fixture feels stiff while moving. 0.05 keeps it
      # a jerk guard against spikes without throttling normal guiding.
      max_target_step_m: 0.05  # max move of the commanded equilibrium per tick [m] -- a jerk guard
      simple_plane:  # lock one base axis, free the other two
        type: "plane"  # geometry class: plane | cartesian_box | cylinder | sinusoid | maze
        restricted_axis: "y"  # locked base axis (x | y | z); the other two stay free
      bounding_box:  # keep the EE inside an X range and above a Z floor
        type: "cartesian_box"  # geometry class: plane | cartesian_box | cylinder | sinusoid | maze
        z_min: 0.3  # floor: EE kept above this height [m]
        x_min: 0.2  # EE kept at X at or above this [m]
        x_max: 0.5  # EE kept at X at or below this [m]
      flat_table:  # keep the EE above a table height
        type: "cartesian_box"  # geometry class: plane | cartesian_box | cylinder | sinusoid | maze
        z_min: 0.3  # table surface: EE kept above this height [m]
      cylinder_tube:  # keep the EE within a vertical cylinder
        type: "cylinder"  # geometry class: plane | cartesian_box | cylinder | sinusoid | maze
        radius: 0.4  # EE kept within this horizontal distance of the axis [m]
        center_x: 0.0  # cylinder axis X [m]
        center_y: 0.0  # cylinder axis Y [m]
      sine_wave:  # sinusoidal rail along the pull axis
        type: "sinusoid"  # geometry class: plane | cartesian_box | cylinder | sinusoid | maze
        # Rail: y = start_y + amplitude * sin(spatial_freq * (z - start_z)). The operator pulls along
        # z (free: the equilibrium tracks measured z); x is pinned and y is dragged onto the rail.
        #
        # SIZE THE WAVELENGTH AGAINST THE PULL STROKE or there is no sinusoid to feel. The operator only
        # ever traverses `stroke` metres of the wave, so what they experience is
        # stroke / (2*pi/spatial_freq) periods of it. Below ~1 period it reads as a straight lean:
        #
        #   0.03 / 12.0 -> 52 cm wavelength -> 0.38 periods over a 20 cm pull: ONE shallow 3 cm bulge
        #                                      that never comes back. Felt as "it just went straight."
        #   0.04 / 30.0 -> 21 cm wavelength -> 0.95 periods over a 20 cm pull: -4 cm, back through 0,
        #                                      +4 cm. An actual there-and-back wave.
        #
        # FORCE is set by AMPLITUDE, not by wavelength. Pulling straight down and ignoring the rail puts
        # you at most `amplitude` off it, so the worst case is K_y * amplitude = 40 N at 1000 N/m. The
        # steeper slope (amplitude*spatial_freq = 1.2, a 50 deg rail) costs no extra force — it only
        # makes the wave tighter. But it DOES demand lateral speed: v_y = slope * v_pull, so the CLIK's
        # max_linear_velocity (1.0 m/s) must exceed it or the rail gets rate-limited flat.
        # Pair with the "Rail guide (uniform 1000)" cabinet profile.
        # Keep the slope moderate: 0.1 / 20.0 would be slope 2.0 (63 deg), and a 10 cm error = 300 N at
        # "Stiff" -- enough to slam the arm sideways and trip the cabinet.
        amplitude: 0.04  # sideways swing of the rail [m] -- this sets the force
        spatial_freq: 30.0  # rail frequency along the pull [rad/m]; wavelength = 2*pi / this
        pull_axis: "z"  # axis the operator pulls along (free)
        osc_axis: "y"  # axis the rail swings in
